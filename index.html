<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141218">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>취향 진열장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* 갈무리 (SIL OFL 1.1, © Minseo Lee) — 폰트 파일은 저장소에 함께 보관해요. 라이선스: Galmuri-LICENSE.txt */
@font-face{font-family:"Galmuri9";src:url("Galmuri9.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Galmuri9";src:url("Galmuri11-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Layout: one-screen vitrine — slim date bar on top, a fixed 3:4 shelf board centered in the rest (same layout on every device), month view as a calendar of tiny shelves. Single dark look by choice. */
:root{
  --bg:#141218; --stage:#18161d; --board:#1d1a23; --surface:#221f29; --line:#34303d;
  --fg:#ece8f2; --muted:#8e889b; --accent:#b4c8ff; --danger:#ff9b8f;
  --f-display:"Galmuri9","Galmuri11","Apple SD Gothic Neo",monospace;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:"Galmuri9","Galmuri11",var(--f-display);font-weight:400;font-size:20px;letter-spacing:0;flex:1;min-width:0;text-align:left}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;image-rendering:pixelated;flex:none;box-shadow:0 0 0 1px var(--line)}
.brand .bt{min-width:0;display:block}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.02em;color:var(--muted);margin-bottom:1px;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.datebar{display:flex;align-items:center;justify-content:space-between;padding-block:2px 8px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.datebar button.nav{width:52px;height:52px;border-radius:16px;color:var(--fg);display:grid;place-items:center;position:relative;border:1px solid var(--line);background:var(--surface)}
.datebar button.nav::after{content:"";position:absolute;inset:-8px}
.datebar button.nav:active{background:var(--surface)}
.dlabel{text-align:center;padding:4px 10px;border-radius:12px}
.dlabel:active{background:var(--surface)}
.dlabel b{font-family:var(--f-display);font-size:22px;font-weight:700;display:block;letter-spacing:-.01em}
.dlabel span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.status{margin-inline:max(16px,env(safe-area-inset-left,0px));margin-bottom:8px;padding:10px 12px;border-radius:10px;
  background:var(--surface);font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center}
.status p{margin:0;flex:1}
.status button{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap}
/* 쌓임 맥락: 선반 안의 물건 번호가 아무리 커져도 선반 밖(팝업 창·버튼)으로는 못 나와요 */
main{flex:1;position:relative;min-height:0;isolation:isolate;z-index:0}
#stage{position:absolute;inset:0;isolation:isolate;z-index:0;background:var(--stage);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  display:grid;place-items:center;background-image:radial-gradient(circle at 50% 120%,#2a2533 0,transparent 60%)}
#board{position:relative;isolation:isolate;background:var(--board);border-radius:14px;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line);background-image:radial-gradient(ellipse at 50% 110%,#2b2633 0,transparent 65%)}
.item{position:absolute;left:0;top:0;transform-origin:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.item img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.item.ph{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2c2836,transparent 70%)}
.item.bad{aspect-ratio:1;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.item.active{cursor:grabbing}
.item.active img{filter:drop-shadow(0 16px 22px rgba(0,0,0,.55)) drop-shadow(0 0 1px var(--accent))}
/* PC용 손잡이 — 마우스를 쓸 때만 보여요 */
/* 선택 테두리와 핸들 — 물건 크기와 상관없이 손가락으로 잡기 좋은 크기 */
.selbox{position:absolute;left:0;top:0;transform-origin:center;border:1.5px dashed var(--accent);border-radius:12px;z-index:10;touch-action:none;cursor:grab;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25)}
.selbox:active{cursor:grabbing}
.sh{position:absolute;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#141218;display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,.5);border:2px solid var(--bg);touch-action:none}
.sh::after{content:"";position:absolute;inset:-10px;border-radius:50%}
.sh svg{transform:rotate(var(--unrot,0deg));pointer-events:none}
.sh-move{left:-17px;top:-17px;cursor:move}
.sh-rs{right:-17px;bottom:-17px;cursor:nwse-resize}
.sh.on{background:#fff}
@media (hover:hover) and (pointer:fine){.item:hover{filter:brightness(1.06)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;pointer-events:none;line-height:1.6}
.empty b{display:block;font-family:var(--f-display);font-size:18px;color:var(--fg);margin-bottom:6px}
.fab{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:18px;
  width:58px;height:58px;border-radius:18px;background:var(--accent);color:#141218;font-size:30px;line-height:1;
  box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5}
.fab:disabled{opacity:.4}
.count{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:22px;
  font-family:var(--f-body);font-size:12px;letter-spacing:.01em;color:var(--muted);z-index:5;pointer-events:none}
#month{position:absolute;inset:0;overflow-y:auto;padding-block:4px 90px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mwrap{max-width:720px;margin:0 auto}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk span{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;letter-spacing:.1em;padding:4px 0}
.cell{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--stage);position:relative;overflow:hidden;text-align:left}
.cell.out{visibility:hidden}
.cell .n{position:absolute;left:6px;top:4px;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:4}
.cell.today .n{color:var(--accent)}
.cell.has{background:var(--surface)}
/* 한 달 화면: 날짜 칸 = 그날의 작은 선반(선반과 같은 3:4) */
.cell .mini{position:absolute;inset:0;pointer-events:none;overflow:hidden;isolation:isolate;z-index:0;border-radius:inherit}
.cell .mini .bgimg,.cell .mini .bgdim{position:absolute;inset:0;background-size:cover;background-position:center}
.cell .mini .mi{position:absolute;left:0;top:0;transform-origin:center}
.cell .mini .mi img{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.cell .mini .mi .tin{position:absolute;left:0;top:0;transform-origin:0 0}
.cell .mini .mi .tin.sh-none .tln{text-shadow:0 2px 5px rgba(0,0,0,.45)}
.cell.bgc .n,.cell.bgc .more{background:rgba(20,18,24,.6);color:#d8d3e0;border-radius:4px;padding:0 3px}
.cell.has .n,.cell.has .more{text-shadow:0 1px 2px rgba(0,0,0,.7)}
.cell.today.bgc .n{color:var(--accent)}
.cell .more{position:absolute;right:5px;bottom:3px;font-family:var(--f-mono);font-size:10px;color:var(--muted);z-index:4}
.msum{font-size:13px;color:var(--muted);margin:14px 4px 0}
.scrim{position:fixed;inset:0;background:rgba(8,7,10,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-size:18px;margin:0}
.sheet p.note{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
/* 창이 화면보다 길면 칸이 찌그러지지 않고 창이 스크롤돼요 (미리보기 이미지가 넘치지 않게) */
.sheet>*{flex-shrink:0}
.preview{height:180px;position:relative;background:var(--stage);border-radius:14px;overflow:hidden}
/* 이미지는 상자 안쪽(여백 10px)에 가운데 정렬로 딱 맞춰요 */
.preview img{position:absolute;inset:0;margin:auto;max-height:calc(100% - 20px);max-width:80%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
label{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,textarea{font:inherit;font-family:var(--f-body);font-size:16px;color:var(--fg);background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-transform:none;letter-spacing:0;width:100%}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:500;text-align:center;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);color:#141218;border-color:var(--accent)}
.btn.del{color:var(--danger)}
.btn:disabled{opacity:.5}
.toggle{flex-direction:row;align-items:center;gap:10px;font-family:var(--f-body);font-size:14px;letter-spacing:0;text-transform:none;color:var(--fg);padding:10px 12px;background:var(--stage);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
/* 편집 화면 */
.scrim.full{align-items:stretch}
.scrim.full .sheet{max-width:none;max-height:none;height:100%;border-radius:0;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));gap:8px}
.scrim.full .grab{display:none}
.ed{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.ed-top{display:flex;align-items:center;gap:8px}
.ed-top b{flex:1;text-align:center;font-family:var(--f-display);font-size:17px}
.ed-top .btn{flex:none;padding:9px 14px}
.ed-hint{margin:0;color:var(--muted);font-size:13px;line-height:1.5;text-align:center;min-height:2.6em}
.ed-area{flex:1;min-height:0;display:grid;place-items:center;background:var(--stage);border-radius:14px;overflow:hidden;touch-action:none}
.ed-wrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.ed-wrap img,.ed-wrap canvas{display:block;width:100%;height:100%;-webkit-user-drag:none;touch-action:none}
.ed-wrap.checker{background-color:#2a2732;background-image:linear-gradient(45deg,#36323f 25%,transparent 25%,transparent 75%,#36323f 75%),linear-gradient(45deg,#36323f 25%,transparent 25%,transparent 75%,#36323f 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.ed-wrap canvas{cursor:crosshair}
.crop{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(8,7,10,.62);cursor:move;touch-action:none}
.crop i{position:absolute;width:26px;height:26px;border:3px solid var(--accent);background:transparent}
.crop i[data-h="nw"]{left:-5px;top:-5px;border-right:0;border-bottom:0;cursor:nwse-resize}
.crop i[data-h="ne"]{right:-5px;top:-5px;border-left:0;border-bottom:0;cursor:nesw-resize}
.crop i[data-h="sw"]{left:-5px;bottom:-5px;border-right:0;border-top:0;cursor:nesw-resize}
.crop i[data-h="se"]{right:-5px;bottom:-5px;border-left:0;border-top:0;cursor:nwse-resize}
.crop i::after{content:"";position:absolute;inset:-12px}
.ed-tools{display:flex;flex-direction:column;gap:10px}
.ed-tools .btn{padding:10px}
.ed-seg{align-self:center}
.ed-seg button{padding:8px 18px;font-size:14px}
.ed-size{flex-direction:row;align-items:center;gap:12px;font-family:var(--f-body);font-size:13px;letter-spacing:0;text-transform:none}
.ed-size input{flex:1;accent-color:var(--accent);padding:0;border:0;background:none}
.err{color:var(--danger);font-size:13px;margin:0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.progress{font-family:var(--f-body);font-size:12px;line-height:1.5;margin:0;color:var(--muted);text-align:center}
/* 화면이 낮을 때(가로로 눕힌 커버 화면 등) 위쪽을 줄여 선반을 키워요 */
@media (max-height:560px){.brand .logo{width:26px;height:26px;border-radius:7px}.bar{padding-block:6px 2px}.brand small{display:none}.datebar{padding-block:0 4px}.dlabel b{font-size:18px}.dlabel span{display:none}.datebar button.nav{width:44px;height:44px}}
/* 펼친 화면처럼 넓을 때 위쪽 막대를 가운데로 모아요 */
@media (min-width:700px){.bar,.datebar{max-width:760px;width:100%;margin-inline:auto}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
/* ---- 시작 화면: 밤의 방 한쪽, 픽셀 진열장 ---- */
.login{position:fixed;inset:0;z-index:40;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 24px),linear-gradient(#17141d,#1c1824 60%,#1c1824)}
.login.wide{flex-direction:row;gap:48px}
.lg-floor{position:absolute;left:0;right:0;bottom:0;height:var(--floorH,30%);
  background:repeating-linear-gradient(90deg,#241a16 0 58px,#1e1612 58px 60px),#241a16;border-top:4px solid #3a2a20;box-shadow:0 -2px 0 #120d0a}
.lg-floor::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.lg-win{position:absolute;image-rendering:pixelated}
.lg-box{position:relative;flex:none;z-index:1}
.lg-scene{position:absolute;left:0;top:0;width:320px;height:518px;transform-origin:0 0}
.lg-shelf{position:absolute;left:0;top:118px;width:320px;height:400px}
.lg-shelf>svg{position:absolute;inset:0;width:100%;height:100%;shape-rendering:crispEdges}
.lg-it{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));transform-origin:50% 100%}
.lg-glow{position:absolute;pointer-events:none;z-index:0}
.lg-zz{position:absolute;font-family:"Galmuri9",monospace;font-size:11px;color:var(--accent);opacity:0}
.lg-sign{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:10px;padding:9px 16px 10px 10px;background:#8a5a38;
  box-shadow:inset 0 3px 0 #a9744b,inset 0 -4px 0 #5e3b24;
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.lg-sign img{width:36px;height:36px;image-rendering:pixelated;box-shadow:0 0 0 2px #3a2418}
.lg-sign h1{margin:0;font-family:"Galmuri9",monospace;font-weight:700;font-size:24px;color:#fff3df;text-shadow:2px 2px 0 #4a2c1a;letter-spacing:.02em}
.lg-cta{position:relative;z-index:2;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px}
.login.wide .lg-cta{margin-top:0}
.lg-cta p{margin:0;font-size:12.5px;line-height:1.6;color:#a39cb0}
.lg-cta .err{color:var(--danger);font-size:13px}
.pxbtn{font-family:"Galmuri9",monospace;font-weight:700;font-size:16px;color:#141218;background:var(--accent);border:0;padding:15px 26px;min-width:250px;cursor:pointer;
  clip-path:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
  box-shadow:inset 0 -4px 0 #8aa2e6}
.pxbtn:active{box-shadow:inset 0 4px 0 #8aa2e6;padding:17px 26px 13px}
.pxbtn:focus-visible{outline:3px solid #fff3df;outline-offset:3px}
.login .ver2{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,0px));left:0;right:0;z-index:2;font-family:var(--f-mono);font-size:11px;color:var(--muted);opacity:.6}
@media (prefers-reduced-motion:no-preference){
  .lg-it.bob{animation:lgbob 4s ease-in-out infinite}@keyframes lgbob{50%{translate:0 -2px}}
  .lg-it.flame{animation:lgfl 1.2s steps(2) infinite}@keyframes lgfl{50%{translate:0 -1px}}
  .lg-zz{animation:lgzz 3.6s ease-in infinite}@keyframes lgzz{15%{opacity:.8}100%{opacity:0;translate:10px -22px}}
  .lg-it.hop{animation:lghop .45s ease-out}@keyframes lghop{40%{translate:0 -10px}}
}
/* 연결 안내가 창 위로 떠오를 때 */
.status.float{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin:0;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);border:1px solid var(--accent)}
body.has-float .scrim{padding-top:var(--floatH,80px)}
body.has-float .scrim.full .sheet{padding-top:10px}

function lgFit(){
  const L=$("login");if(!L||L.hidden||!L.clientWidth)return;
  const W=L.clientWidth,H=L.clientHeight,wide=W>H*1.2&&H<640;
  L.classList.toggle("wide",wide);
  const cta=L.querySelector(".lg-cta"),box=$("lgBox"),sc=$("lgScene");
  let k=wide?Math.min((H-60)/518,(W-cta.offsetWidth-48-40)/320):Math.min((H-cta.offsetHeight-30-60)/518,(W-32)/320);
  k=Math.max(.4,Math.min(W<600?1:1.2,k));   // 폰 화면은 미리보기와 같은 크기까지만
  box.style.width=320*k+"px";box.style.height=518*k+"px";sc.style.transform=`scale(${k})`;
  const lr=L.getBoundingClientRect(),br=box.getBoundingClientRect();
  $("lgFloor").style.setProperty("--floorH",Math.max(0,lr.bottom-(br.top+518*k)+2)+"px");
  const win=$("lgWin");if(!win)return;
  const wk=W<600?2:3,ww=30*wk,wh=36*wk;win.style.width=ww+"px";win.style.height=wh+"px";
  const signRight=br.left+br.width/2+110*k-lr.left;
  let x,y,show=true;
  if(wide||W>=600){x=br.left-lr.left-ww-Math.min(70,br.left-lr.left-ww-12);y=br.top-lr.top+118*k+10;if(br.left-lr.left<ww+24)show=false}
  else{x=W-ww-14;y=br.top-lr.top-8;if(x<signRight+8){y=br.top-lr.top-wh-16;if(y<10)show=false}}
  win.hidden=!show;win.style.left=x+"px";win.style.top=y+"px";
}

async function drive(path,opts={},isRetry){
  const t=await getToken();
  let r;
  try{r=await fetch(path.startsWith("http")?path:API+path,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+t}})}
  catch(_){throw{code:"offline"}}
  if(r.status===401&&!isRetry){token=null;store.del("tok");return drive(path,opts,true)}
  if((r.status===429||r.status>=500)&&!isRetry&&(!opts.method||opts.method==="GET")){await new Promise(z=>setTimeout(z,800+Math.random()*700));return drive(path,opts,true)}
  if(!r.ok){let msg="",reason="";try{const j=await r.json();msg=j.error.message;reason=(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||""}catch(_){}throw{code:r.status,message:msg,reason}}
  return r;
}
function errText(e){
  if(e&&e.code==="offline"||!navigator.onLine) return "인터넷에 연결되어 있지 않아요. 연결되면 다시 시도해 주세요.";
  if(e&&e.code==="auth") return "구글 로그인이 필요해요.";
  if(e&&e.code===403&&/storageQuota|quota/i.test(e.reason+e.message)) return "구글 드라이브 저장 공간이 가득 찼어요.";
  if(e&&(e.code===403||e.code===401)) return "드라이브 접근이 거부됐어요. 다시 연결해 주세요.";
  if(e&&e.code===404) return "드라이브에서 파일을 찾지 못했어요. 다른 기기에서 지웠을 수 있어요.";
  if(e&&(e.code>=500||e.code===429)) return "구글 드라이브가 잠시 바빠요. 잠시 후 다시 시도해 주세요.";
  return "드라이브와 통신하지 못했어요"+(e&&e.message?": "+e.message:".");
}

function readMeta(f){

  }
  const d=validDate(m.d)?m.d:(f.createdTime?ymd(new Date(f.createdTime)):today());
  const arr=(a,n)=>Array.isArray(a)&&a.length===n&&a.every(v=>typeof v==="number"&&isFinite(v))?a:null;
  return{n:typeof m.n==="string"?m.n:"",m:typeof m.m==="string"?m.m:"",d,x:clamp(num(m.x,.5),0,1),y:clamp(num(m.y,.5),0,1),s:clamp(num(m.s,.38),.06,1.4),r:num(m.r,0),z:num(m.z,1),
    o:typeof m.o==="string"?m.o:"",c:arr(m.c,4),t:arr(m.t,2),
    k:m.k==="text"?"text":"",tx:typeof m.tx==="string"?m.tx:"",st:m.k==="text"?readStyle(m.st):null,
    sl:Number.isInteger(m.sl)?clamp(m.sl,1,5):1,
    at:typeof m.at==="number"&&m.at>0?m.at:0,
    fr:m.fr&&typeof m.fr==="object"&&validDate(m.fr.d)?{d:m.fr.d,sl:Number.isInteger(m.fr.sl)?clamp(m.fr.sl,1,5):1,x:clamp(num(m.fr.x,.5),0,1),y:clamp(num(m.fr.y,.5),0,1),s:clamp(num(m.fr.s,.38),.06,1.4),r:num(m.fr.r,0),z:num(m.fr.z,1),why:typeof m.fr.why==="string"?m.fr.why:"",cid:typeof m.fr.cid==="string"?m.fr.cid:""}:null};
}
function metaStr(m){const r=v=>Math.round(v*1000)/1000;const o={v:2,g:2,n:m.n,m:m.m,d:m.d,x:r(m.x),y:r(m.y),s:r(m.s),r:Math.round(((m.r%360)+360)%360*10)/10,z:m.z};
  if(m.o)o.o=m.o;if(m.c)o.c=m.c.map(Math.round);if(m.t)o.t=m.t.map(Math.round);
  if(m.k==="text"){o.k="text";o.tx=m.tx;o.st=m.st}

const pending=new Map();let active=0;const queue=[];
async function cacheGet(id){try{const c=await caches.open("shelf-img");const r=await c.match("img/"+id);return r?await r.blob():null}catch(_){return null}}
async function cachePut(id,blob){try{const c=await caches.open("shelf-img");await c.put("img/"+id,new Response(blob,{headers:{"Content-Type":blob.type||"image/png"}}))}catch(_){}}
async function cacheDel(id){try{const c=await caches.open("shelf-img");await c.delete("img/"+id)}catch(_){}}
function setImg(id,blob){const old=imgs.get(id);if(old)URL.revokeObjectURL(old);const u=URL.createObjectURL(blob);imgs.set(id,u);pending.delete(id);cachePut(id,blob);return u}
function getImg(id){
  if(imgs.has(id))return Promise.resolve(imgs.get(id));
  if(pending.has(id))return pending.get(id);
  const p=(async()=>{
    const hit=await cacheGet(id);
    if(hit){const u=URL.createObjectURL(hit);imgs.set(id,u);return u}
    return new Promise((res,rej)=>{queue.push({id,res,rej});pump()});
  })();
  pending.set(id,p);p.catch(()=>pending.delete(id));return p;
}
function getBlob(id){return getImg(id).then(u=>fetch(u)).then(r=>r.blob())}
function pump(){
  while(active<4&&queue.length){
    const{id,res,rej}=queue.shift();active++;
    drive(`/files/${id}?alt=media`).then(r=>r.blob()).then(b=>{cachePut(id,b);const u=URL.createObjectURL(b);imgs.set(id,u);res(u)})
      .catch(rej).finally(()=>{active--;pump()});
  }
}

const BG_LIB="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/+esm";
const BG_CFG={model:"isnet_fp16",output:{format:"image/png"}};
let aiPromise=null,aiState="idle",aiPct=0;const aiListeners=new Set();
function aiLabel(){return store.get("aiReady")?`AI 준비 중… ${aiPct}%`:`AI 모델을 내려받는 중… ${aiPct}% (처음 한 번만)`}
function ensureAI(onProgress){
  if(onProgress)aiListeners.add(onProgress);
  if(aiState==="ready"){if(onProgress)aiListeners.delete(onProgress);return aiPromise}
  if(!aiPromise){
    aiState="loading";aiPct=0;
    const cfg={...BG_CFG,progress:(key,c,t)=>{if(/fetch/.test(key)&&t){aiPct=Math.min(99,Math.round(c/t*100));aiListeners.forEach(f=>f(aiPct))}}};
    aiPromise=(async()=>{
      const lib=await import(BG_LIB);
      const fn=lib.removeBackground||lib.default;if(typeof fn!=="function")throw new Error("no fn");
      if(typeof lib.preload==="function")await lib.preload(cfg);
      else{const c=document.createElement("canvas");c.width=c.height=32;c.getContext("2d").fillRect(8,8,16,16);await fn(await new Promise(r=>c.toBlob(r,"image/png")),cfg)}
      aiState="ready";store.set("aiReady","1");aiListeners.clear();
      return blob=>fn(blob,BG_CFG);
    })().catch(e=>{aiPromise=null;aiState="idle";aiListeners.clear();throw e});
  }
  return aiPromise;
}
function preloadAI(){
  const c=navigator.connection;if(c&&c.saveData)return;   // 데이터 절약 모드면 미리 받지 않아요

}

var railSide=false;   // v2.6: 칸 점은 선반 아래 나무틀에 가로로 박혀 있어요
/* 선반(나무틀 포함)을 화면에 꽉 차게. 안쪽 칸은 모든 기기에서 같은 비율(BOARD_RATIO)이라 배치가 똑같아요 */
function layout(){
  const st=$("stage"),b=$("board");if(st.hidden)return;
  const SW=st.clientWidth,SH=st.clientHeight;if(!SW||!SH)return;
  const M=8,FR=12;   // 바깥 여백, 나무틀 두께
  const TAB=$("cells").hidden?0:46;   // 칸이 여러 개면 아래 서랍 탭 자리
  let w=Math.min(SW-M*2-FR*2,(SH-M*2-FR*2-TAB)*BOARD_RATIO);w=Math.max(120,Math.floor(w));
  const h=Math.round(w/BOARD_RATIO);
  const resized=b.style.width!==w+"px";
  b.style.width=w+"px";b.style.height=h+"px";
  if(resized&&b.querySelector(".bgimg"))applyBoardBg();   // 흐림 정도는 선반 폭에 맞춰요
  b.querySelectorAll(".item").forEach(el=>{const it=items.find(i=>i.id===el.dataset.id);if(it)place(el,it)});
  if(selId)posSel();
}
function render(){
  updAtticBadge();
  $("stage").hidden=view!=="day";if(view!=="day"){$("selbox").hidden=true;$("tools").hidden=true}renderCells();$("month").hidden=view!=="month";$("list").hidden=view!=="list";
  $("prev").style.visibility=$("next").style.visibility=view==="list"?"hidden":"visible";
  const d=parse(cur);
  if(view==="day"){
    $("dTitle").textContent=md(cur);
    $("dSub").textContent=d.getFullYear()+" · "+WD[d.getDay()]+"요일"+(cur===today()?" · 오늘":"");
    curCell=clamp(curCell,1,dayCells(cur));renderCells();layout();renderDay();
  }else if(view==="month"){
    $("dTitle").textContent=d.getFullYear()+"년 "+(d.getMonth()+1)+"월";
    $("dSub").textContent=ymd(new Date()).slice(0,7)===cur.slice(0,7)?"이번 달":"날짜를 누르면 그날 선반이 열려요";
    renderMonth();
  }else{
    $("dTitle").textContent="전체 목록";
    $("dSub").textContent=items.length?`${items.length}점`:"";
    renderList();
  }
}
function renderDay(){
  const b=$("board");b.querySelectorAll(".item").forEach(e=>e.remove());hideTag();
  applyBoardBg();
  const list=dayOrder(cur,curCell),nc=dayCells(cur);
  $("empty").hidden=list.length>0;
  $("empty").querySelector("b").textContent=nc>1?`${curCell}번 칸이 비어 있어요`:"이날의 선반이 비어 있어요";
  const nObj=list.filter(i=>!isText(i)).length,nTxt=list.length-nObj;
  $("count").textContent=[nc>1?`${curCell}번 칸`:"",nObj?(nc>1?`물건 ${nObj}점`:`이날 진열된 물건 ${nObj}점`):"",nTxt?`글 ${nTxt}개`:""].filter(Boolean).join(" · ");
  list.forEach(it=>{
    const el=document.createElement("div");el.dataset.id=it.id;
    if(isText(it)){el.className="item text";b.appendChild(el);place(el,it);bind(el,it);return}
    el.className="item ph";
    b.appendChild(el);place(el,it);bind(el,it);
    getImg(it.id).then(u=>{if(!el.isConnected)return;el.classList.remove("ph");const im=new Image();im.alt=it.meta.n||"물건";im.draggable=false;im.onload=()=>{if(selId===it.id)posSel()};im.src=u;el.prepend(im)})
      .catch(()=>{if(!el.isConnected)return;el.classList.remove("ph");el.classList.add("bad");el.prepend(document.createTextNode("불러오지 못함"))});
  });
  const si=selItem();if(si&&si.meta.d===cur&&cellOf(si)===curCell)select(si);else if(selId)deselect();
}
function place(el,it){
  const b=$("board"),W=b.clientWidth,H=b.clientHeight,w=it.meta.s*W;
  if(isText(it))placeText(el,it,W,H);
  else{el.style.width=w+"px";el.style.zIndex=zRank(it);
    el.style.transform=`translate(${it.meta.x*W-w/2}px,${it.meta.y*H-w/2}px) rotate(${it.meta.r}deg)`}
  if(selId===it.id)posSel();
  else if(tagId===it.id)posTag(el);
}
/* ---- 이름표: 마우스를 올리거나, 누르거나, 끌 때 물건 아래에 이름을 보여줘요 ---- */
let tagId=null,tagT=null;
function showTag(el,it){
  clearTimeout(tagT);
  if(isText(it)||!it.meta.n){hideTag();return}
  const t=$("tag");t.innerHTML=esc(it.meta.n)+(it.meta.m?`<small>메모 있음</small>`:"");t.hidden=false;tagId=it.id;posTag(el);
}
function posTag(el){
  const t=$("tag"),b=$("board");if(t.hidden)return;if(selId&&tagId===selId&&el.id!=="selbox"&&!$("selbox").hidden)el=$("selbox");
  const br=b.getBoundingClientRect(),r=el.getBoundingClientRect();
  const cx=clamp(r.left+r.width/2-br.left,t.offsetWidth/2+6,br.width-t.offsetWidth/2-6);
  let y=r.bottom-br.top+8;
  if(y+t.offsetHeight>br.height-6)y=r.top-br.top-t.offsetHeight-8;   // 아래 공간이 없으면 위로
  t.style.left=cx+"px";t.style.top=clamp(y,6,br.height-t.offsetHeight-6)+"px";
}
function hideTag(delay){clearTimeout(tagT);const f=()=>{$("tag").hidden=true;tagId=null};if(delay)tagT=setTimeout(f,delay);else f()}
function renderMonth(){
  const box=$("month");box.innerHTML="";const wrap=document.createElement("div");wrap.className="mwrap";box.appendChild(wrap);
  const d=parse(cur),y=d.getFullYear(),mo=d.getMonth();
  const wk=document.createElement("div");wk.className="wk";WD.forEach(w=>{const s=document.createElement("span");s.textContent=w;wk.appendChild(s)});wrap.appendChild(wk);
  const g=document.createElement("div");g.className="grid";wrap.appendChild(g);
  const first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate();let total=0;
  for(let i=0;i<first;i++){const c=document.createElement("div");c.className="cell out";g.appendChild(c)}
  for(let n=1;n<=days;n++){
    const key=ymd(new Date(y,mo,n));const its=items.filter(i=>i.meta.d===key).sort((a,c)=>c.meta.z-a.meta.z);total+=its.length;
    const c=document.createElement("button");c.className="cell"+(its.length?" has":"")+(key===today()?" today":"");
    c.setAttribute("aria-label",(mo+1)+"월 "+n+"일, 물건 "+its.length+"개");
    c.innerHTML=`<span class="n">${n}</span>`;
    const mc=miniCell(key),spec=miniBg(key,mc,its.length>0),nc=dayCells(key);
    if(its.length||spec){
      const mini=document.createElement("div");mini.className="mini";mini._d=key;mini._c=mc;mini._spec=spec;c.prepend(mini);
      if(spec)c.classList.add("bgc");
    }
    if(nc>1){const m=document.createElement("span");m.className="more";m.textContent=nc+"칸";m.title=`이날 ${nc}칸 중 ${mc}번 칸이 보여요`;c.appendChild(m)}
    c.onclick=()=>{cur=key;curCell=mc;view="day";render()};g.appendChild(c);
  }
  fillMinis(box);
  const s=document.createElement("p");s.className="msum";s.textContent=total?`이 달에 ${total}개를 모았어요.`:"이 달엔 아직 모은 물건이 없어요.";wrap.appendChild(s);
  $("count").textContent="";
}
/* ---- 한 달 화면의 작은 선반 ----
   1번 칸을 그대로 줄여서 보여줘요. 1번 칸이 비어 있으면 물건이 있는 첫 칸을 보여줘요.
   배경은 물건이 있는 날, 또는 그 날짜·칸에 따로 정한 배경이 있을 때만 깔아요(공통 배경만 있는 빈 날은 비워 둬요). */
function miniCell(d){const n=dayCells(d);for(let c=1;c<=n;c++)if(items.some(i=>i.meta.d===d&&cellOf(i)===c))return c;return 1}
function miniBg(d,c,has){const b=bgFor(d,c);return has||b.lvl==="cell"||b.lvl==="day"?b.spec:null}
function miniPlace(el,it,W,H){
  if(isText(it)){placeText(el,it,W,H);return}
  const w=it.meta.s*W;el.style.width=w+"px";el.style.zIndex=zRank(it);
  el.style.transform=`translate(${it.meta.x*W-w/2}px,${it.meta.y*H-w/2}px) rotate(${it.meta.r}deg)`;
}
function miniBgPaint(mini,W){
  const spec=mini._spec;mini.querySelectorAll(".bgimg,.bgdim").forEach(e=>e.remove());mini.style.backgroundColor="";
  if(!spec)return;
  if(spec.t==="color"){mini.style.backgroundColor=spec.c;return}
  mini.style.backgroundColor="var(--board)";
  getImg(spec.id).then(u=>{if(!mini.isConnected)return;const px=blurPx(spec,W);
    mini.insertAdjacentHTML("afterbegin",`<i class="bgimg" style="background-image:url('${u}');inset:${-px*2}px;filter:${px?`blur(${px}px)`:"none"}"></i><i class="bgdim" style="background:rgba(0,0,0,${spec.dim})"></i>`)}).catch(()=>{});
}
function fillMinis(root){
  root.querySelectorAll(".mini").forEach(mini=>{
    const c=mini.parentNode,W=c.clientWidth,H=W/BOARD_RATIO;mini._w=W;
    mini.style.height=H+"px";mini.style.top=((c.clientHeight-H)/2)+"px";
    miniBgPaint(mini,W);
    dayOrder(mini._d,mini._c).forEach(it=>{
      const el=document.createElement("div");el.className="mi"+(isText(it)?" text":"");el._it=it;mini.appendChild(el);
      miniPlace(el,it,W,H);
      if(!isText(it))getImg(it.id).then(u=>{if(!el.isConnected)return;const im=new Image();im.alt="";im.draggable=false;im.src=u;el.prepend(im)}).catch(()=>{});
    });
  });
}
/* 화면 크기가 바뀌면(폴드 접기/펴기) 다시 맞춰요 */
function relayoutMinis(){
  document.querySelectorAll("#month .mini").forEach(mini=>{
    const c=mini.parentNode,W=c.clientWidth,H=W/BOARD_RATIO;if(!W||W===mini._w)return;
    mini.style.height=H+"px";mini.style.top=((c.clientHeight-H)/2)+"px";
    if(mini._spec&&mini._spec.t==="img")miniBgPaint(mini,W);mini._w=W;
    mini.querySelectorAll(".mi").forEach(el=>miniPlace(el,el._it,W,H));
  });
}
/* ---- 목록과 검색 ---- */
function norm(t){return String(t||"").toLowerCase().replace(/\s+/g,"")}
function hl(text,q){
  if(!q)return esc(text);const raw=String(text);const t=raw.toLowerCase();const qq=q.trim().toLowerCase();if(!qq)return esc(raw);
  const i=t.indexOf(qq);if(i<0)return esc(raw);
  return esc(raw.slice(0,i))+"<mark>"+esc(raw.slice(i,i+qq.length))+"</mark>"+esc(raw.slice(i+qq.length));
}
function renderList(){
  const body=$("lbody");body.innerHTML="";$("count").textContent="";
  const q=$("q").value;const nq=norm(q);
  const match=it=>{if(!nq)return true;const d=parse(it.meta.d);
    const hay=norm(it.meta.n)+"|"+norm(it.meta.m)+"|"+norm((it.meta.tx||"").replace(/==/g,""))+"|"+it.meta.d+"|"+norm(`${d.getMonth()+1}월${d.getDate()}일`)+"|"+norm(`${d.getFullYear()}년`);
    return hay.includes(nq)};
  const list=items.filter(match).sort((a,b)=>a.meta.d<b.meta.d?1:a.meta.d>b.meta.d?-1:b.meta.z-a.meta.z);
  if(!items.length){body.innerHTML=`<p class="lempty">아직 모은 물건이 없어요.<br>+ 를 눌러 첫 물건을 올려 보세요.</p>`;return}
  if(!list.length){body.innerHTML=`<p class="lempty">'${esc(q)}'에 맞는 물건이 없어요.</p>`;return}
  let lastMonth="";
  list.forEach(it=>{
    const mk=it.meta.d.slice(0,7);
    if(mk!==lastMonth){lastMonth=mk;const cnt=list.filter(x=>x.meta.d.slice(0,7)===mk).length;
      const h=document.createElement("div");h.className="lmonth";const [yy,mm]=mk.split("-");h.innerHTML=`${yy}년 ${Number(mm)}월<span>${cnt}점</span>`;body.appendChild(h)}
    const d=parse(it.meta.d);
    const row=document.createElement("button");row.className="lrow";
    if(isText(it)){const first=(it.meta.tx||"").replace(/==/g,"").split("\n")[0];
      row.innerHTML=`<span class="lthumb ltxt">가</span><span class="ltext"><b>${hl(first,q)}</b><small>${md(it.meta.d)} ${WD[d.getDay()]}요일${dayCells(it.meta.d)>1?` · ${cellOf(it)}번 칸`:""} · 글</small></span>`;
      row.onclick=()=>{cur=it.meta.d;curCell=cellOf(it);view="day";render();requestAnimationFrame(()=>{const el=document.querySelector(`.item[data-id="${it.id}"]`);if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1500)}})};
      body.appendChild(row);return}
    row.innerHTML=`<span class="lthumb"></span><span class="ltext"><b class="${it.meta.n?"":"none"}">${it.meta.n?hl(it.meta.n,q):"이름 없음"}</b>
      <small>${md(it.meta.d)} ${WD[d.getDay()]}요일${dayCells(it.meta.d)>1?` · ${cellOf(it)}번 칸`:""}${it.meta.m?" · "+hl(it.meta.m.split("\n")[0],q):""}</small></span>`;
    getImg(it.id).then(u=>{const im=new Image();im.src=u;im.alt="";row.querySelector(".lthumb").appendChild(im)}).catch(()=>{});
    row.onclick=()=>{cur=it.meta.d;curCell=cellOf(it);view="day";render();
      requestAnimationFrame(()=>{const el=document.querySelector(`.item[data-id="${it.id}"]`);if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1500)}})};
    body.appendChild(row);
  });
}
let qT=null;$("q").addEventListener("input",()=>{clearTimeout(qT);qT=setTimeout(renderList,120)});

/* 폴드처럼 화면 크기가 갑자기 바뀌어도 바로 다시 맞춰요 */
let lt=null;
const relayout=()=>{cancelAnimationFrame(lt);lt=requestAnimationFrame(()=>{if(view==="day")layout();else if(view==="month")relayoutMinis()})};
window.addEventListener("resize",relayout);
window.addEventListener("orientationchange",relayout);
if(window.visualViewport)visualViewport.addEventListener("resize",relayout);
if(window.ResizeObserver)new ResizeObserver(relayout).observe($("stage"));

/* ================= 칸 (하루 여러 칸 · 서랍장) =================
   물건마다 칸 번호(sl)를 저장하고, 없으면 1번 칸이에요(기존 물건은 모두 1번 칸).
   날짜별 칸 개수는 드라이브의 shelf-config.json 에 저장해요(빈 칸도 기억해야 해서). */
const MAX_CELLS=5, CFG_NAME="shelf-config.json";
let cfg={v:1,days:{}},cfgId=null,curCell=1,attic=[];
function cellOf(it){return it.meta.sl||1}
function dayCells(d){let n=(cfg.days[d]&&cfg.days[d].n)||1;for(const it of items)if(it.meta.d===d)n=Math.max(n,cellOf(it));return clamp(n,1,MAX_CELLS)}
function setDayCells(d,n,ids){const o={...(cfg.days[d]||{}),n};if(ids)o.ids=ids;if(n<=1)delete o.n;if(Object.keys(o).length)cfg.days[d]=o;else delete cfg.days[d];saveCfg()}
/* 칸마다 바뀌지 않는 이름표. 칸을 지워 번호가 당겨져도 '원래 칸'을 정확히 찾고, 칸 배경도 따라가요 */
function newCid(){return Math.random().toString(36).slice(2,8)}
function cellIds(d){
  const o=cfg.days[d]||{},n=dayCells(d);
  let ids=Array.isArray(o.ids)?o.ids.filter(x=>typeof x==="string"):[];
  if(ids.length===n)return ids.slice();
  while(ids.length<n)ids.push(newCid());ids=ids.slice(0,n);
  cfg.days[d]={...o,ids};saveCfg();return ids.slice();
}
function splitLive(all){items=all.filter(i=>!i.meta.at);attic=all.filter(i=>i.meta.at)}
async function loadCfg(){
  const q=encodeURIComponent(`name='${CFG_NAME}' and '${folderId}' in parents and trashed=false`);
  const j=await (await drive(`/files?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`)).json();
  const f=j.files&&j.files[0];if(!f)return;
  cfgId=f.id;
  const t=await (await drive(`/files/${f.id}?alt=media`)).json();
  if(t&&typeof t==="object"){cfg={...t,v:1,days:(t.days&&typeof t.days==="object")?t.days:{}}}
}
let cfgT=null,cfgQ=Promise.resolve();
function saveCfg(){
  if(!cfgT)pendingSaves++;clearTimeout(cfgT);
  cfgT=setTimeout(()=>{cfgT=null;cfgQ=cfgQ.then(writeCfg).catch(()=>toast("칸 설정을 저장하지 못했어요")).finally(()=>{pendingSaves--})},400);
}
async function writeCfg(){
  const body=JSON.stringify(cfg);
  if(!cfgId){
    const form=new FormData();
    form.append("metadata",new Blob([JSON.stringify({name:CFG_NAME,parents:[folderId],mimeType:"application/json",description:"취향 진열장 설정(날짜별 칸 개수 등). 지우지 말아 주세요."})],{type:"application/json"}));
    form.append("file",new Blob([body],{type:"application/json"}));
    cfgId=(await (await drive(UPLOAD+"?uploadType=multipart&fields=id",{method:"POST",body:form})).json()).id;
  }else await drive(UPLOAD+`/${cfgId}?uploadType=media&fields=id`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});
}

/* ---- 칸 표시(세로 픽셀 네모) ---- */
function renderCells(){
  const box=$("cells"),n=dayCells(cur);
  if(view!=="day"){box.hidden=true;return}
  curCell=clamp(curCell,1,n);
  let h="";
  if(n>1){for(let i=1;i<=n;i++)h+=`<button class="ctab" role="tab" data-c="${i}" aria-selected="${i===curCell}" aria-label="${i}번 칸${i===curCell?" (지금 보는 칸, 누르면 칸 설정)":""}"${i===curCell?' aria-current="true"':""}>${i}</button>`;
    if(n<MAX_CELLS)h+=`<button class="ctab add" data-c="add" aria-label="새 칸 만들기">＋</button>`}
  const was=box.hidden;box.innerHTML=h;box.hidden=!h;
  if(was!==box.hidden&&view==="day")layout();   // 탭이 생기거나 없어지면 선반 크기를 다시 맞춰요
}
function posCells(){}
$("cells").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.c==="add"){addCell();return}
  const c=+b.dataset.c;if(c===curCell)openCellSheet(cur,c);else goCell(c);
});
let cellAnim=false;
async function goCell(c,noAnim){
  const n=dayCells(cur);c=clamp(c,1,n);if(c===curCell||cellAnim)return;
  const dir=c>curCell?1:-1,b=$("board");deselect();
  const still=noAnim||!b.animate||matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ax="X";   // 칸 점이 가로로 놓여 있어서 옆으로 넘어가요
  if(!still){cellAnim=true;try{await b.animate([{transform:`translate${ax}(0)`,opacity:1},{transform:`translate${ax}(${-dir*28}px)`,opacity:0}],{duration:140,easing:"ease-in"}).finished}catch(_){}}
  curCell=c;renderDay();renderCells();
  if(!still){try{await b.animate([{transform:`translate${ax}(${dir*28}px)`,opacity:0},{transform:`translate${ax}(0)`,opacity:1}],{duration:180,easing:"ease-out"}).finished}catch(_){}cellAnim=false}
}
function addCell(){
  const n=dayCells(cur);if(n>=MAX_CELLS)return;
  const ids=cellIds(cur);ids.push(newCid());setDayCells(cur,n+1,ids);renderCells();goCell(n+1);toast(`${n+1}번 칸을 만들었어요`);
}
/* 칸 설정 창: 지금 보는 칸 네모를 한 번 더 누르면 열려요 */
function openCellSheet(d,c){
  d=d||cur;c=c||curCell;
  const n=dayCells(d),inCell=items.filter(i=>i.meta.d===d&&cellOf(i)===c);
  let jump="";for(let i=1;i<=n;i++){const k=items.filter(x=>x.meta.d===d&&cellOf(x)===i).length;jump+=`<button class="btn${i===c?" on":""}" data-go="${i}"${i===c?' aria-current="true"':""}>${i}번 칸<small>${k?k+"개":"비어 있음"}</small></button>`}
  const s=sheet(`<h2>칸</h2>
    <p class="note">${md(d)}에는 칸이 ${n}개 있어요. 지금은 ${c}번 칸을 보고 있어요. ${inCell.length?`물건과 글 ${inCell.length}개가 있어요.`:"비어 있어요."}</p>
    <div class="cgrid" id="cGo">${jump}${n<MAX_CELLS?`<button class="btn add" id="cAdd">＋ 새 칸</button>`:""}</div>
    <button class="btn" id="cBg">이 칸 배경 바꾸기</button>
    <div id="cDelBox">${n>1?`<button class="btn del" id="cDel">${c}번 칸 지우기</button>`:`<p class="note">칸이 하나뿐이라 지울 수 없어요.</p>`}</div>
    <div class="row"><button class="btn" id="cClose">닫기</button></div>`);
  const q=id=>s.querySelector("#"+id);
  q("cClose").onclick=()=>s.close();
  q("cGo").addEventListener("click",async e=>{const b=e.target.closest("[data-go]");if(!b)return;const g=+b.dataset.go;await s.close();
    if(d!==cur||view!=="day"){cur=d;view="day";curCell=g;render()}else goCell(g)});
  if(q("cAdd"))q("cAdd").onclick=async()=>{await s.close();if(d!==cur||view!=="day"){cur=d;view="day";render()}addCell()};
  q("cBg").onclick=async()=>{await s.close();openBg(n>1?"cell":"day")};
  if(q("cDel"))q("cDel").onclick=()=>{
    if(!inCell.length){s.close();deleteCell(d,c);return}
    q("cDelBox").innerHTML=`<p class="warn">물건과 글 ${inCell.length}개는 다락방으로 옮겨져요. 원래 자리를 기억해서 나중에 되돌릴 수 있어요.</p>
      <div class="row"><button class="btn" id="cNo">취소</button><button class="btn del" id="cYes">지우고 다락방으로 옮기기</button></div>`;
    q("cNo").onclick=()=>s.close();
    q("cYes").onclick=()=>{s.close();deleteCell(d,c)};
  };
}
/* 다락방으로: 원래 날짜·칸(이름표)·위치·크기·각도·레이어를 기억해요 */
function toAttic(it,why){
  const m=it.meta;
  m.fr={d:m.d,sl:cellOf(it),x:m.x,y:m.y,s:m.s,r:m.r,z:m.z,why:why||"",cid:cellIds(m.d)[cellOf(it)-1]||""};m.at=Date.now();
  items=items.filter(i=>i!==it);attic.push(it);
  if(selId===it.id)deselect();
  saveMeta(it);
}
function deleteCell(d,c){
  const n=dayCells(d);if(n<=1)return;
  const ids=cellIds(d);
  const moved=items.filter(i=>i.meta.d===d&&cellOf(i)===c);
  moved.forEach(it=>toAttic(it,"cell"));
  const delCid=ids[c-1];
  ids.splice(c-1,1);
  items.forEach(it=>{if(it.meta.d===d&&cellOf(it)>c){it.meta.sl=cellOf(it)-1;saveMeta(it)}});   // 뒤 칸 번호를 앞으로 당겨요
  setDayCells(d,n-1,ids);
  {const day=cfg.days[d];if(day&&day.cbg&&day.cbg[delCid]){const old=readBg(day.cbg[delCid]);delete day.cbg[delCid];if(!Object.keys(day.cbg).length)delete day.cbg;saveCfg();if(old&&old.t==="img")dropBgImage(old.id)}}
  if(d===cur){if(curCell>c||curCell>n-1)curCell=Math.max(1,curCell-1);deselect();renderDay();renderCells()}
  toast(moved.length?`${c}번 칸을 지웠어요. ${moved.length}개는 다락방에 있어요`:`${c}번 칸을 지웠어요`,3000);
}
/* 물건 창: 다른 칸으로 이동 */
function cellMoveHtml(p,it){const n=dayCells(it.meta.d);if(n<2)return"";
  let b="";for(let i=1;i<=n;i++)b+=`<button class="btn" data-mv="${i}"${i===cellOf(it)?" disabled":""}>${i}번 칸${i===cellOf(it)?" (지금)":""}</button>`;
  return `<div class="lyr" id="${p}Mv"><span class="lyr-t">다른 칸으로 이동</span><div class="row mini">${b}</div></div>`}
function bindCellMove(q,p,it,s){const box=q(p+"Mv");if(!box)return;
  box.addEventListener("click",e=>{const b=e.target.closest("[data-mv]");if(!b||b.disabled)return;const c=+b.dataset.mv;
    const tgt=dayOrder(it.meta.d,c);it.meta.sl=c;it.meta.z=(tgt.length?tgt[tgt.length-1].meta.z:0)+1;   // 옮긴 칸에서 맨 앞
    saveMeta(it);deselect();s.close();render();toast(`${c}번 칸으로 옮겼어요`)})}
/* 키보드(PC): 선택한 물건이 없으면 위/아래 화살표로 칸 이동 */
document.addEventListener("keydown",e=>{
  if(view!=="day"||selId||document.querySelector(".scrim")||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowUp"){e.preventDefault();goCell(curCell-1)}
  if(e.key==="ArrowDown"){e.preventDefault();goCell(curCell+1)}
});

/* ================= 다락방 =================
   지운 물건·지운 칸의 물건이 모이는 곳. 원래 날짜·칸·위치·크기·각도·레이어를 기억하고,
   들어간 지 30일이 지나면 드라이브에서도 완전히 지워요. */
const ATTIC_DAYS=30, DAY_MS=864e5;
function atticLeft(it){return Math.max(0,Math.ceil((it.meta.at+ATTIC_DAYS*DAY_MS-Date.now())/DAY_MS))}
/* 원래 칸 찾기
   1) 원래 칸(이름표)이 그대로 있으면 그 칸 — 앞 칸이 지워져 번호가 당겨졌어도 정확히 찾아가요
   2) 없으면 같은 번호의 칸이 지금 있으면 그 칸 — 지웠다가 다시 만든 칸 포함
   3) 그 번호의 칸도 없으면 그날 1번 칸 */
function originCell(fr){
  if(!fr)return 1;
  if(fr.cid){const i=cellIds(fr.d).indexOf(fr.cid);if(i>=0)return i+1}
  return fr.sl<=dayCells(fr.d)?fr.sl:1;
}
function fromAttic(it,where){
  const m=it.meta,fr=m.fr||{d:m.d,sl:1,x:m.x,y:m.y,s:m.s,r:m.r,z:m.z};
  if(where==="origin"){m.d=fr.d;m.sl=originCell(fr);m.x=fr.x;m.y=fr.y;m.s=fr.s;m.r=fr.r;m.z=fr.z}
  else{m.d=cur;m.sl=curCell;m.x=fr.x;m.y=fr.y;m.s=fr.s;m.r=fr.r;const top=dayOrder(cur,curCell);m.z=(top.length?top[top.length-1].meta.z:0)+1}
  m.at=0;m.fr=null;
  attic=attic.filter(i=>i!==it);items.push(it);
  saveMeta(it);
  return m;
}
/* 완전히 지우기 (드라이브에서도, 원본 사진 포함) */
async function hardDelete(it){
  try{await drive(`/files/${it.id}`,{method:"DELETE"})}catch(e){if(!(e&&e.code===404))throw e}
  if(it.meta.o)drive(`/files/${it.meta.o}`,{method:"DELETE"}).catch(()=>{});
  attic=attic.filter(i=>i!==it);cacheDel(it.id);updAtticBadge();
}
/* 30일 지난 물건 정리: 앱을 열 때 조용히 */
async function purgeAttic(){
  const old=attic.filter(i=>atticLeft(i)<=0);if(!old.length)return;
  let n=0;for(const it of old){try{await hardDelete(it);n++}catch(_){}}
  if(n)toast(`다락방에서 30일 지난 물건 ${n}개를 완전히 지웠어요`,3000);
}
function openAttic(){
  const s=sheet(`<div class="attic">
    <div class="ed-top"><b>다락방</b><button class="btn" id="aClose">닫기</button></div>
    <p class="note">지운 물건과 지운 칸의 물건이 모여요. 들어온 지 ${ATTIC_DAYS}일이 지나면 드라이브에서도 완전히 지워져요.</p>
    <div class="alist" id="aList"></div></div>`);
  s.classList.add("full");
  const q=id=>s.querySelector("#"+id);
  q("aClose").onclick=()=>s.close();
  function draw(){
    const box=q("aList");box.innerHTML="";
    const list=attic.slice().sort((a,b)=>b.meta.at-a.meta.at);
    if(!list.length){box.innerHTML=`<p class="lempty">다락방이 비어 있어요.</p>`;return}
    list.forEach(it=>{
      const m=it.meta,fr=m.fr||{d:m.d,sl:1},left=atticLeft(it);
      const oc=originCell(fr);
      const name=isText(it)?(m.tx||"").replace(/==/g,"").split("\n")[0]:(m.n||"이름 없음");
      const row=document.createElement("div");row.className="arow";
      row.innerHTML=`<span class="lthumb${isText(it)?" ltxt":""}">${isText(it)?"가":""}</span>
        <div class="ltext"><b class="${!isText(it)&&!m.n?"none":""}">${esc(name)}</b>
          <small>${md(fr.d)}${dayCells(fr.d)>1||fr.sl>1?` · ${fr.sl}번 칸`:""}에서 · ${fr.why==="cell"?"칸을 지워서":"빼서"} 옮겨짐</small>
          <small class="${left<=3?"soon":""}">${left<=0?"곧 완전히 지워져요":`${left}일 뒤 완전히 지워져요`}</small></div>
        <div class="row mini aact">
          <button class="btn" data-a="origin" title="${md(fr.d)} ${oc}번 칸 원래 위치로">원래 자리로${oc!==fr.sl?` (${oc}번 칸)`:""}</button>
          <button class="btn" data-a="here">지금 칸에 꺼내기</button>
          <button class="btn del" data-a="drop">완전히 버리기</button></div>`;
      if(!isText(it))getImg(it.id).then(u=>{const im=new Image();im.src=u;im.alt="";row.querySelector(".lthumb").appendChild(im)}).catch(()=>{});
      let armed=false;
      row.addEventListener("click",async e=>{
        const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
        if(a==="drop"){
          if(!armed){armed=true;b.textContent="정말 버릴까요?";setTimeout(()=>{if(armed&&b.isConnected&&!b.disabled){armed=false;b.textContent="완전히 버리기"}},4000);return}
          b.disabled=true;b.textContent="버리는 중…";s.busy=true;
          try{await hardDelete(it);toast("완전히 버렸어요");draw()}
          catch(err){b.disabled=false;b.textContent="완전히 버리기";armed=false;toast(errText(err),3000)}
          finally{s.busy=false}
          return;
        }
        const nm=fromAttic(it,a);
        toast(a==="origin"?`${md(nm.d)} ${nm.sl}번 칸 원래 자리로 되돌렸어요`:`${md(nm.d)} ${nm.sl}번 칸에 꺼냈어요`,2600);
        render();draw();
      });
      box.appendChild(row);
    });
  }
  draw();
}

/* ================= 선반 배경 =================
   우선순위: 칸 > 날짜 > 공통 > 기본.
   공통은 cfg.bg, 날짜는 cfg.days[d].bg, 칸은 cfg.days[d].cbg[칸 이름표] 에 저장해요.
   배경 사진은 드라이브 '배경' 폴더에 올리고 id 로 가리켜요. */
const BG_NAME="배경";
const BG_COLORS=[["#14121a","먹"],["#1b2233","밤하늘"],["#1f2a24","숲"],["#2e1a22","와인"],["#3a2f28","나무"],["#d9cdb8","모래"],["#f1ece2","종이"],["#b9cde6","하늘"]];
let bgFolderId=null;
function readBg(v){
  if(!v||typeof v!=="object")return null;
  if(v.t==="color"&&/^#[0-9a-f]{6}$/i.test(v.c||""))return{t:"color",c:v.c};
  if(v.t==="img"&&typeof v.id==="string"&&v.id)return{t:"img",id:v.id,dim:clamp(num(v.dim,0),0,.85),blur:clamp(num(v.blur,0),0,10)};
  return null;
}
function bgFor(d,c){
  const day=cfg.days[d]||{},cid=(day.ids||[])[c-1];
  const cb=cid&&day.cbg?readBg(day.cbg[cid]):null;if(cb)return{spec:cb,lvl:"cell"};
  const db=readBg(day.bg);if(db)return{spec:db,lvl:"day"};
  const gb=readBg(cfg.bg);if(gb)return{spec:gb,lvl:"common"};
  return{spec:null,lvl:"default"};
}
function getScopeBg(scope,d,c){
  if(scope==="common")return readBg(cfg.bg);
  const day=cfg.days[d]||{};
  if(scope==="day")return readBg(day.bg);
  const cid=(day.ids||[])[c-1];return cid&&day.cbg?readBg(day.cbg[cid]):null;
}
function setScopeBg(scope,d,c,spec){
  const old=getScopeBg(scope,d,c);
  if(scope==="common"){if(spec)cfg.bg=spec;else delete cfg.bg}
  else{
    const ids=scope==="cell"?cellIds(d):null;
    const day={...(cfg.days[d]||{})};
    if(scope==="day"){if(spec)day.bg=spec;else delete day.bg}
    else{const cid=ids[c-1];const cbg={...(day.cbg||{})};if(spec)cbg[cid]=spec;else delete cbg[cid];if(Object.keys(cbg).length)day.cbg=cbg;else delete day.cbg}
    if(Object.keys(day).length)cfg.days[d]=day;else delete cfg.days[d];
  }
  saveCfg();
  if(old&&old.t==="img"&&!(spec&&spec.t==="img"&&spec.id===old.id))dropBgImage(old.id);
}
/* 더 이상 아무 데서도 안 쓰는 배경 사진은 드라이브 휴지통으로 */
function bgRefs(id){let n=0;const chk=v=>{const b=readBg(v);if(b&&b.t==="img"&&b.id===id)n++};
  chk(cfg.bg);for(const d of Object.values(cfg.days)){chk(d.bg);if(d.cbg)Object.values(d.cbg).forEach(chk)}return n}
function dropBgImage(id){if(bgRefs(id))return;patch(id,{trashed:true}).catch(()=>{});cacheDel(id)}
async function ensureBgFolder(){if(bgFolderId)return bgFolderId;bgFolderId=await findOrMakeFolder("bgFolderId",BG_NAME,folderId,"선반 배경 사진이에요.");return bgFolderId}
/* 흐림 정도: 선반 폭 400px 기준 px. 화면과 공유 이미지가 같은 비율로 흐려져요 */
function blurPx(spec,W){return spec&&spec.t==="img"?spec.blur*W/400:0}

/* ---- 화면 선반에 그리기 ---- */
let bgGen=0;
function applyBoardBg(){
  const b=$("board"),layer=$("bgLayer"),{spec}=bgFor(cur,curCell),my=++bgGen;
  b.classList.toggle("custom",!!spec);
  b.style.backgroundColor=spec&&spec.t==="color"?spec.c:"";
  layer.innerHTML="";layer.hidden=!(spec&&spec.t==="img");
  b.dataset.light=spec&&spec.t==="color"&&isLight(spec.c)?"1":"";
  if(!spec||spec.t!=="img")return;
  getImg(spec.id).then(u=>{
    if(my!==bgGen)return;
    const px=blurPx(spec,b.clientWidth);
    layer.innerHTML=`<i class="bgimg" style="background-image:url('${u}');inset:${-px*2}px;filter:${px?`blur(${px}px)`:"none"}"></i><i class="bgdim" style="background:rgba(0,0,0,${spec.dim})"></i>`;
  }).catch(()=>{if(my===bgGen)layer.innerHTML=`<i class="bgdim" style="background:var(--board)"></i>`});
}
function isLight(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150}

/* ---- 공유 이미지에 그리기 (화면과 같은 계산) ---- */
async function drawBoardBg(g,spec,x,y,W,H){
  if(!spec){
    g.fillStyle=SHARE_C.board;g.fillRect(x,y,W,H);
    const rg=g.createRadialGradient(x+W/2,y+H*1.1,0,x+W/2,y+H*1.1,H*.75);rg.addColorStop(0,"#2b2633");rg.addColorStop(1,"rgba(43,38,51,0)");
    g.fillStyle=rg;g.fillRect(x,y,W,H);return;
  }
  if(spec.t==="color"){g.fillStyle=spec.c;g.fillRect(x,y,W,H);return}
  g.fillStyle=SHARE_C.board;g.fillRect(x,y,W,H);
  let im;try{im=await imgFromUrl(await getImg(spec.id))}catch(_){return}
  const px=blurPx(spec,W),ex=px*2,bw=W+ex*2,bh=H+ex*2,k=Math.max(bw/im.naturalWidth,bh/im.naturalHeight);
  const dw=im.naturalWidth*k,dh=im.naturalHeight*k;
  g.save();if(px)g.filter=`blur(${px}px)`;g.drawImage(im,x-ex+(bw-dw)/2,y-ex+(bh-dh)/2,dw,dh);g.restore();
  if(spec.dim){g.fillStyle=`rgba(0,0,0,${spec.dim})`;g.fillRect(x,y,W,H)}
}

/* ---- 배경 설정 창 ---- */
function openBg(scope){
  const d=cur,c=curCell,n=dayCells(d);
  if(scope==="cell"&&n<2)scope="day";
  let draft=null,draftBlob=null,draftUrl=null;
  const scopes=[...(n>1?[["cell",`이 칸 (${c}번)`]]:[]),["day",`이 날짜`],["common","공통"]];
  const s=sheet(`<h2>선반 배경</h2>

    <div class="seg bgtype" role="group" aria-label="배경 종류"><button data-ty="color">색</button><button data-ty="img">사진</button></div>

      <label class="swc custom" title="직접 고르기" aria-label="직접 고르기"><input type="color" id="bPick" value="#2a2433"></label></div>
    <div id="bImg" hidden>
      <div class="row"><button class="btn" id="bChoose">사진 고르기</button></div>
      <label class="ed-size" for="bDim">어둡게<input type="range" id="bDim" min="0" max="80" value="25"></label>
      <label class="ed-size" for="bBlur">흐리게<input type="range" id="bBlur" min="0" max="10" step="0.5" value="0"></label>
      <p class="thint">사진은 선반 비율(3:4)에 맞춰 자르고, 드라이브 '취향 진열장/배경' 폴더에 저장돼요.</p>
    </div>
    <p class="err" id="bErr" hidden></p>
    <div class="row"><button class="btn" id="bReset"></button></div>
    <div class="row"><button class="btn" id="bClose">닫기</button><button class="btn pri" id="bApply">적용</button></div>

  const q=id=>s.querySelector("#"+id);

    s.querySelectorAll("[data-ty]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ty===(q("bImg").hidden?"color":"img")));
    s.querySelectorAll("#bColor [data-c]").forEach(b=>b.setAttribute("aria-pressed",!!draft&&draft.t==="color"&&draft.c.toLowerCase()===b.dataset.c));
    const eff=bgFor(d,c);
    q("bNow").textContent=`지금 이 선반에는 ${LV[eff.lvl]}이 쓰이고 있어요.`+(scope==="common"?" 공통 배경은 따로 정하지 않은 모든 선반에 쓰여요.":scope==="day"?` 이 날짜의 모든 칸에 쓰여요${n>1?" (칸 배경을 정한 칸 제외)":""}.`:" 이 칸에만 쓰여요.");
    // 미리보기
    const pv=q("bPv"),pi=q("bPvImg"),pd=q("bPvDim");
    const show=draft||(scope==="common"?null:bgFor(d,c).spec);
    pv.style.backgroundColor=show&&show.t==="color"?show.c:"";pv.classList.toggle("custom",!!show);
    if(show&&show.t==="img"){
      const u=draftUrl&&draft===show?draftUrl:imgs.get(show.id);
      const px=blurPx(show,pv.clientWidth||150);
      pi.style.backgroundImage=u?`url('${u}')`:"";pi.style.inset=-px*2+"px";pi.style.filter=px?`blur(${px}px)`:"none";pd.style.background=`rgba(0,0,0,${show.dim})`;
      if(!u)getImg(show.id).then(()=>sync()).catch(()=>{});
    }else{pi.style.backgroundImage="";pd.style.background="transparent"}
    // 되돌리기 버튼
    const has=!!getScopeBg(scope,d,c);const rb=q("bReset");
    rb.hidden=!has;
    rb.textContent=scope==="common"?"기본 배경으로 되돌리기":scope==="cell"&&getScopeBg("day",d,c)?"날짜 배경으로 되돌리기":"공통 배경으로 되돌리기";
    q("bApply").disabled=!draft;
  }
  s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.sc){scope=b.dataset.sc;q("bImg").hidden=true;q("bColor").hidden=false;load();if(draft&&draft.t==="img"){q("bImg").hidden=false;q("bColor").hidden=true}sync()}
    else if(b.dataset.ty){const img=b.dataset.ty==="img";q("bImg").hidden=!img;q("bColor").hidden=img;sync()}
    else if(b.dataset.c&&b.closest("#bColor")){draft={t:"color",c:b.dataset.c};draftBlob=null;sync()}});
  q("bPick").addEventListener("input",()=>{draft={t:"color",c:q("bPick").value.toLowerCase()};draftBlob=null;sync()});
  const slid=()=>{if(draft&&draft.t==="img"){draft={...draft,dim:q("bDim").value/100,blur:+q("bBlur").value};sync()}};
  q("bDim").addEventListener("input",slid);q("bBlur").addEventListener("input",slid);
  q("bChoose").onclick=()=>q("bFile").click();
  q("bFile").onchange=async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    if(/heic|heif/i.test(f.type)||/\.(heic|heif)$/i.test(f.name)){toast("HEIC 사진은 열 수 없어요. JPG로 찍어 주세요.",3500);return}
    let src;try{src=await shrink(f,2400,"image/jpeg")}catch(_){toast("사진을 읽지 못했어요");return}
    const r=await openEditor(src,{ratio:BOARD_RATIO,cropOnly:true});
    if(!r||!r.img)return;
    draftBlob=r.img;if(draftUrl)URL.revokeObjectURL(draftUrl);draftUrl=URL.createObjectURL(r.img);
    draft={t:"img",id:"",dim:q("bDim").value/100,blur:+q("bBlur").value};sync();
  };
  q("bReset").onclick=()=>{setScopeBg(scope,d,c,null);draft=null;render();load();toast("되돌렸어요")};
  q("bClose").onclick=()=>s.close();
  q("bApply").onclick=async()=>{
    if(!draft)return;const b=q("bApply");b.disabled=true;b.textContent="적용 중…";s.busy=true;q("bErr").hidden=true;
    try{
      let spec=draft;
      if(draft.t==="img"&&draftBlob){
        await ensureBgFolder();
        const form=new FormData();
        form.append("metadata",new Blob([JSON.stringify({name:`배경-${scope==="common"?"공통":d}.jpg`,parents:[bgFolderId]})],{type:"application/json"}));
        form.append("file",draftBlob);
        const j=await (await drive(UPLOAD+"?uploadType=multipart&fields=id",{method:"POST",body:form})).json();
        setImg(j.id,draftBlob);spec={...draft,id:j.id};draftBlob=null;
      }
      setScopeBg(scope,d,c,readBg(spec));
      s.busy=false;s.close();render();toast({cell:`${c}번 칸 배경을 바꿨어요`,day:`${md(d)} 배경을 바꿨어요`,common:"공통 배경을 바꿨어요"}[scope]);
    }catch(err){s.busy=false;b.disabled=false;b.textContent="적용";q("bErr").hidden=false;q("bErr").textContent=errText(err)}
  };
  s.onpop=()=>{if(draftUrl)URL.revokeObjectURL(draftUrl)};
  load();
  if(draft&&draft.t==="img"){q("bImg").hidden=false;q("bColor").hidden=true;sync()}
}

/* ================= 조작 (손가락·마우스) ================= */
let dragging=false;
function topZ(){return Math.max(0,...items.map(i=>i.meta.z))}
/* 같은 날 물건들 사이의 순서(1부터). 화면 쌓임 번호는 항상 작게 유지돼요 */
function zCmp(a,b){return a.meta.z-b.meta.z||(a.id<b.id?-1:a.id>b.id?1:0)}
function zRank(it){let r=1;const c=cellOf(it);for(const o of items){if(o!==it&&o.meta.d===it.meta.d&&cellOf(o)===c&&zCmp(o,it)<0)r++}return r}
function dayOrder(d,c){return items.filter(i=>i.meta.d===d&&(c==null||cellOf(i)===c)).sort(zCmp)}
function minZ(){return items.length?Math.min(...items.map(i=>i.meta.z)):0}
function itemEl(id){return document.querySelector(`#board .item[data-id="${id}"]`)}
function normDeg(r){return((r+180)%360+360)%360-180}

/* ---- 선택 ----
   한 번 누르면 선택: 물건보다 넉넉한 테두리 + 왼쪽 위(이동)·오른쪽 아래(크기·회전) 핸들.
   선택 중에는 테두리 안의 터치가 모두 선택한 물건에만 가요. 빈 곳을 누르면 해제. */
let selId=null;
const SEL_PAD=14, SEL_MIN=72;
function selItem(){return selId?items.find(i=>i.id===selId):null}
function select(it){
  if(!it||it.meta.d!==cur||cellOf(it)!==curCell){deselect();return}
  selId=it.id;posSel();const el=itemEl(it.id);if(el)showTag(el,it);
  updTools();
}
function deselect(){selId=null;$("selbox").hidden=true;$("tools").hidden=true;hideTag()}
/* 물건을 고르면 아래에 편집 도구가 떠요 */
function updTools(){
  const it=selItem(),t=$("tools");if(!it||view!=="day"){t.hidden=true;return}
  t.hidden=false;
  const n=dayOrder(it.meta.d,cellOf(it)).length,k=zRank(it);
  $("tDown").disabled=k===1;$("tUp").disabled=k===n;
}
$("tDown").onclick=()=>{const it=selItem();if(it&&setLayer(it,"down"))select(it)};
$("tUp").onclick=()=>{const it=selItem();if(it&&setLayer(it,"up"))select(it)};
$("tInfo").onclick=()=>{const it=selItem();if(!it)return;hideTag();isText(it)?openText(it):openItem(it)};
$("tOut").onclick=()=>{const it=selItem();if(!it)return;toAttic(it,"del");render();toast("다락방으로 옮겼어요. 메뉴 › 다락방에서 되돌릴 수 있어요",3000)};
$("tMove").onclick=()=>{
  const it=selItem();if(!it)return;const n=dayCells(it.meta.d),c0=cellOf(it);
  let b="";for(let i=1;i<=n;i++)if(i!==c0)b+=`<button class="btn" data-mv="${i}">${i}번 칸</button>`;
  const s=sheet(`<h2>다른 칸으로</h2><p class="note">${esc(isText(it)?"이 글":(it.meta.n||"이 물건"))}을 옮길 칸을 골라요. 옮긴 칸에서 맨 앞에 놓여요.</p>
    <div class="cgrid" id="mvBox">${b}${n<MAX_CELLS?`<button class="btn add" data-mv="new">＋ 새 칸에 넣기</button>`:""}</div>
    ${!b&&n>=MAX_CELLS?`<p class="note">옮길 칸이 없어요.</p>`:""}
    <div class="row"><button class="btn" id="mvClose">닫기</button></div>`);
  s.querySelector("#mvClose").onclick=()=>s.close();
  s.querySelector("#mvBox").addEventListener("click",e=>{const x=e.target.closest("[data-mv]");if(!x)return;
    let c=x.dataset.mv;if(c==="new"){const ids=cellIds(it.meta.d);ids.push(newCid());setDayCells(it.meta.d,n+1,ids);c=n+1}else c=+c;
    const tgt=dayOrder(it.meta.d,c);it.meta.sl=c;it.meta.z=(tgt.length?tgt[tgt.length-1].meta.z:0)+1;
    saveMeta(it);deselect();s.close();render();toast(`${c}번 칸으로 옮겼어요`)});
};
/* 물건의 화면 위치(가운데·크기·각도)를 place()와 같은 계산으로 구해요 */
function itemGeom(it,el){
  const b=$("board"),W=b.clientWidth,H=b.clientHeight;
  const w=el?el.offsetWidth:it.meta.s*W,h=el?el.offsetHeight:w;
  const cx=it.meta.x*W, cy=isText(it)?it.meta.y*H:it.meta.y*H-w/2+h/2;
  return{cx,cy,w,h,r:it.meta.r};
}
function posSel(){
  const it=selItem(),sb=$("selbox");
  if(!it||view!=="day"){sb.hidden=true;return}
  const el=itemEl(it.id);if(!el){sb.hidden=true;return}
  const g=itemGeom(it,el);
  const fw=Math.max(SEL_MIN,g.w+SEL_PAD*2),fh=Math.max(SEL_MIN,g.h+SEL_PAD*2);
  const br=$("board").getBoundingClientRect(),sr=$("stage").getBoundingClientRect(),ox=br.left-sr.left,oy=br.top-sr.top;
  sb.hidden=false;sb.style.width=fw+"px";sb.style.height=fh+"px";
  sb.style.transform=`translate(${ox+g.cx-fw/2}px,${oy+g.cy-fh/2}px) rotate(${g.r}deg)`;
  sb.style.setProperty("--unrot",(-g.r)+"deg");   // 핸들 아이콘은 늘 똑바로
  if(tagId===it.id)posTag(sb);
}

/* ---- 끌기·두 손가락 조작 (물건 위에서도, 선택 테두리 안에서도 같은 방식) ---- */
let activeG=null;   // 지금 진행 중인 조작. 두 번째 손가락이 다른 곳에 닿아도 이어 받아요
function attachGesture(target,getIt,onTap){
  const pts=new Map();let st=null,moved=false,t0=0,it=null,el=null;
  const geom=()=>{const a=[...pts.values()];
    if(a.length<2)return{cx:a[0].x,cy:a[0].y};
    return{cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,dist:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),ang:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x)}};
  const begin=()=>{st={m:{...it.meta},g:geom()}};
  const api={target,add(e){if(!it)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{target.setPointerCapture(e.pointerId)}catch(_){}begin()}};
  target.addEventListener("pointerdown",e=>{
    if(e.button>0||e.target.closest(".sh"))return;
    e.preventDefault();e.stopPropagation();
    if(activeG&&activeG!==api){activeG.add(e);return}
    if(!pts.size){it=getIt();if(!it)return;el=itemEl(it.id);if(!el)return}
    try{target.setPointerCapture(e.pointerId)}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){moved=false;t0=Date.now();dragging=true;activeG=api;el.classList.add("active");showTag(el,it)}
    begin();
  });
  target.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)||!st)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const b=$("board"),W=b.clientWidth,H=b.clientHeight,g=geom();
    const dx=g.cx-st.g.cx,dy=g.cy-st.g.cy;
    if(!moved&&(Math.hypot(dx,dy)>6||pts.size>1)){moved=true;if(selId!==it.id)select(it)}
    if(!moved)return;
    it.meta.x=clamp(st.m.x+dx/W,0,1);it.meta.y=clamp(st.m.y+dy/H,0,1);
    if(g.dist&&st.g.dist){it.meta.s=clamp(st.m.s*g.dist/st.g.dist,.06,1.4);it.meta.r=normDeg(st.m.r+(g.ang-st.g.ang)*180/Math.PI)}
    place(el,it);
  });
  const end=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size){begin();return}
    if(activeG===api)activeG=null;
    el.classList.remove("active");st=null;dragging=false;
    if(!moved&&Date.now()-t0<450){onTap(it,el,e);return}
    if(moved)saveMeta(it);
    if(e.pointerType!=="mouse"&&selId!==it.id)hideTag(1200);
  };
  target.addEventListener("pointerup",end);target.addEventListener("pointercancel",end);
  target.addEventListener("contextmenu",e=>e.preventDefault());
  // PC: 휠로 크기, Shift+휠로 회전
  let wheelT=null;
  target.addEventListener("wheel",e=>{
    const w=getIt();if(!w)return;const wel=itemEl(w.id);if(!wel)return;
    e.preventDefault();
    if(e.shiftKey) w.meta.r=normDeg(w.meta.r+(e.deltaY>0?4:-4));
    else w.meta.s=clamp(w.meta.s*(e.deltaY>0?.94:1.06),.06,1.4);
    place(wel,w);clearTimeout(wheelT);wheelT=setTimeout(()=>saveMeta(w),500);
  },{passive:false});
}
/* 물건 하나에 붙이기: 처음 누르면 선택, 선택된 물건을 다시 누르면 정보 창 */
function bind(el,it){
  attachGesture(el,()=>it,(t)=>{if(selId===t.id){hideTag();isText(t)?openText(t):openItem(t)}else select(t)});
  el.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"&&!dragging&&!selId)showTag(el,it)});
  el.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&selId!==it.id&&!el.classList.contains("active")&&tagId===it.id)hideTag(120)});
}
/* 선택 테두리: 안쪽 터치는 선택한 물건에만. 핸들 두 개 */
(function selbox(){
  const sb=$("selbox");
  attachGesture(sb,selItem,(t)=>{hideTag();isText(t)?openText(t):openItem(t)});
  const handle=(h,mode)=>h.addEventListener("pointerdown",e=>{
    if(e.button>0)return;const it=selItem();if(!it)return;const el=itemEl(it.id);if(!el)return;
    e.preventDefault();e.stopPropagation();
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    const b=$("board"),br=b.getBoundingClientRect(),W=b.clientWidth,H=b.clientHeight;
    const g=itemGeom(it,el),c={x:br.left+g.cx,y:br.top+g.cy};
    const s0=it.meta.s,r0=it.meta.r,x0=it.meta.x,y0=it.meta.y,sx=e.clientX,sy=e.clientY;
    const d0=Math.max(8,Math.hypot(e.clientX-c.x,e.clientY-c.y)),a0=Math.atan2(e.clientY-c.y,e.clientX-c.x);
    dragging=true;el.classList.add("active");h.classList.add("on");
    const mv=ev=>{
      if(mode==="move"){it.meta.x=clamp(x0+(ev.clientX-sx)/W,0,1);it.meta.y=clamp(y0+(ev.clientY-sy)/H,0,1)}
      else{
        it.meta.s=clamp(s0*Math.hypot(ev.clientX-c.x,ev.clientY-c.y)/d0,.06,1.4);
        let r=r0+(Math.atan2(ev.clientY-c.y,ev.clientX-c.x)-a0)*180/Math.PI;
        if(ev.shiftKey)r=Math.round(r/15)*15;
        it.meta.r=normDeg(r);
      }
      place(el,it)};
    const up=()=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
      dragging=false;el.classList.remove("active");h.classList.remove("on");saveMeta(it)};
    h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
  });
  handle(sb.querySelector(".sh-rs"),"rs");
  // 크기·회전 핸들을 두 번 누르면 똑바로(0도)
  sb.querySelector(".sh-rs").addEventListener("dblclick",e=>{e.stopPropagation();const it=selItem();if(!it)return;it.meta.r=0;const el=itemEl(it.id);if(el)place(el,it);saveMeta(it)});
})();
/* 빈 곳을 누르면 선택 해제. 다른 손가락이 조작 중이면 그 조작에 합류 */
$("stage").addEventListener("pointerdown",e=>{
  if(activeG&&!activeG.target.contains(e.target)&&!e.target.closest(".sh")){activeG.add(e);e.preventDefault();e.stopPropagation();return}
  if(e.target.closest(".item,#selbox"))return;
  deselect();
},true);
/* (좌우로 밀어 날짜 넘기기는 없앴어요. 물건 끄는 동작과 겹치지 않게 날짜는 위쪽 화살표로만 넘겨요) */

/* ---- 레이어: 맨 앞 / 한 칸 앞 / 한 칸 뒤 / 맨 뒤 ----
   같은 날 물건들의 번호를 1,2,3…으로 다시 매겨서 번호가 끝없이 커지지 않게 해요 */
function setLayer(it,mode){
  const list=dayOrder(it.meta.d,cellOf(it)),i=list.indexOf(it),n=list.length;
  const j=mode==="front"?n-1:mode==="bottom"?0:mode==="up"?Math.min(n-1,i+1):Math.max(0,i-1);
  if(j===i){toast(j===n-1?"이미 맨 앞이에요":"이미 맨 뒤예요");return false}
  list.splice(i,1);list.splice(j,0,it);
  list.forEach((o,k)=>{if(o.meta.z!==k+1){o.meta.z=k+1;saveMeta(o)}});
  render();
  toast({front:"맨 앞으로 옮겼어요",up:"한 칸 앞으로 옮겼어요",down:"한 칸 뒤로 보냈어요",bottom:"맨 뒤로 보냈어요"}[mode]);
  return true;
}
function layerRowHtml(p){return `<div class="lyr"><span class="lyr-t">레이어 <b id="${p}Pos"></b></span>
  <div class="row mini"><button class="btn" id="${p}Bottom">맨 뒤로</button><button class="btn" id="${p}Down">한 칸 뒤</button><button class="btn" id="${p}Up">한 칸 앞</button><button class="btn" id="${p}Front">맨 앞으로</button></div></div>`}
function bindLayerRow(q,p,it){
  const upd=()=>{const n=dayOrder(it.meta.d,cellOf(it)).length,k=zRank(it);q(p+"Pos").textContent=`${k} / ${n}`;
    q(p+"Front").disabled=q(p+"Up").disabled=k===n;q(p+"Bottom").disabled=q(p+"Down").disabled=k===1};
  [["Front","front"],["Up","up"],["Down","down"],["Bottom","bottom"]].forEach(([k,m])=>q(p+k).onclick=()=>{setLayer(it,m);upd()});
  upd();
}

/* ---- 수치 입력: X·Y(선반 기준 0~100), 크기(선반 폭의 %), 각도(-180~180) ---- */
function numRowHtml(p){return `<div class="nums">
  <label for="${p}X">X<input id="${p}X" type="number" inputmode="decimal" min="0" max="100" step="0.5"></label>
  <label for="${p}Y">Y<input id="${p}Y" type="number" inputmode="decimal" min="0" max="100" step="0.5"></label>
  <label for="${p}S">크기<input id="${p}S" type="number" inputmode="decimal" min="6" max="140" step="1"></label>
  <label for="${p}R">각도<input id="${p}R" type="number" inputmode="decimal" min="-180" max="180" step="1"></label></div>
  <p class="thint">X·Y는 선반 왼쪽 위가 0, 오른쪽 아래가 100이에요. 크기는 선반 폭 대비 %예요. 입력하면 바로 반영돼요.</p>`}
function bindNumRow(q,p,it){
  const r1=v=>Math.round(v*10)/10;
  const fill=()=>{q(p+"X").value=r1(it.meta.x*100);q(p+"Y").value=r1(it.meta.y*100);q(p+"S").value=Math.round(it.meta.s*100);q(p+"R").value=Math.round(normDeg(it.meta.r))};
  let t=null;
  const apply=(k,raw,commit)=>{
    const v=parseFloat(raw);if(!isFinite(v))return;
    if(k==="X")it.meta.x=clamp(v,0,100)/100;
    if(k==="Y")it.meta.y=clamp(v,0,100)/100;
    if(k==="S")it.meta.s=clamp(v,6,140)/100;
    if(k==="R")it.meta.r=normDeg(clamp(v,-180,180));
    const el=itemEl(it.id);if(el)place(el,it);
    if(commit)fill();
    clearTimeout(t);t=setTimeout(()=>saveMeta(it),400);
  };
  ["X","Y","S","R"].forEach(k=>{const inp=q(p+k);
    inp.addEventListener("input",()=>apply(k,inp.value,false));
    inp.addEventListener("change",()=>apply(k,inp.value,true));
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")inp.blur()})});
  fill();
}

/* 키보드(PC): 선택한 물건을 화살표로 조금씩 옮기기, Esc로 해제 */
document.addEventListener("keydown",e=>{
  if(document.querySelector(".scrim")||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const it=selItem();if(!it)return;
  if(e.key==="Escape"){deselect();return}
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!d)return;
  e.preventDefault();e.stopImmediatePropagation();
  const k=e.shiftKey?.05:.005;it.meta.x=clamp(it.meta.x+d[0]*k,0,1);it.meta.y=clamp(it.meta.y+d[1]*k,0,1);
  const el=itemEl(it.id);if(el)place(el,it);clearTimeout(it._kt);it._kt=setTimeout(()=>saveMeta(it),400);
},true);
function patch(id,body){return drive(`/files/${id}?fields=id`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}
const saving=new Map();
function saveMeta(it){
  pendingSaves++;
  const p=(saving.get(it.id)||Promise.resolve())
    .then(()=>patch(it.id,{description:metaStr(it.meta)}))

let openSheets=0,ignorePop=0;
function sheet(html){
  const s=document.createElement("div");s.className="scrim";
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(s);openSheets++;floatStatus();
  try{history.pushState({sheet:openSheets},"")}catch(_){}
  s.close=()=>{
    if(!s.isConnected)return Promise.resolve();
    s.remove();openSheets--;floatStatus();
    if(history.state&&history.state.sheet){
      ignorePop++;
      return new Promise(r=>{let ok=false;const f=()=>{if(ok)return;ok=true;window.removeEventListener("popstate",f);r()};
        window.addEventListener("popstate",f);setTimeout(f,400);try{history.back()}catch(_){ignorePop--;f()}});
    }
    return Promise.resolve();
  };
  s.addEventListener("click",e=>{if(e.target===s&&!s.busy)s.close()});
  return s;
}
window.addEventListener("popstate",()=>{if(ignorePop){ignorePop--;return}const all=document.querySelectorAll(".scrim");const s=all[all.length-1];
  if(!s)return;
  if(s.busy){try{history.pushState({sheet:openSheets},"")}catch(_){}return}
  s.remove();openSheets--;floatStatus();if(s.onpop)s.onpop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const all=document.querySelectorAll(".scrim");const s=all[all.length-1];if(s&&!s.busy)s.close()}});
