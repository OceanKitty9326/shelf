<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141218">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>취향 진열장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Layout: one-screen vitrine — slim date bar on top, a fixed 3:4 shelf board centered in the rest (same layout on every device), month view as a calendar of tiny shelves. Single dark look by choice. */
:root{
  --bg:#141218; --stage:#18161d; --board:#1d1a23; --surface:#221f29; --line:#34303d;
  --fg:#ece8f2; --muted:#8e889b; --accent:#b4c8ff; --danger:#ff9b8f;
  --f-display:"Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;text-align:left}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;image-rendering:pixelated;flex:none;box-shadow:0 0 0 1px var(--line)}
.brand .bt{min-width:0;display:block}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.datebar{display:flex;align-items:center;justify-content:space-between;padding-block:2px 8px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.datebar button.nav{width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--muted)}
.datebar button.nav:active{background:var(--surface)}
.dlabel{text-align:center;padding:4px 10px;border-radius:12px}
.dlabel:active{background:var(--surface)}
.dlabel b{font-family:var(--f-display);font-size:22px;font-weight:800;display:block;letter-spacing:-.01em}
.dlabel span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.status{margin-inline:max(16px,env(safe-area-inset-left,0px));margin-bottom:8px;padding:10px 12px;border-radius:10px;
  background:var(--surface);font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center}
.status p{margin:0;flex:1}
.status button{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap}
main{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;background:var(--stage);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  display:grid;place-items:center;background-image:radial-gradient(circle at 50% 120%,#2a2533 0,transparent 60%)}
#board{position:relative;background:var(--board);border-radius:14px;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line);background-image:radial-gradient(ellipse at 50% 110%,#2b2633 0,transparent 65%)}
.item{position:absolute;left:0;top:0;transform-origin:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.item img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.item.ph{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2c2836,transparent 70%)}
.item.bad{aspect-ratio:1;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.item.active{cursor:grabbing}
.item.active img{filter:drop-shadow(0 16px 22px rgba(0,0,0,.55)) drop-shadow(0 0 1px var(--accent))}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;pointer-events:none;line-height:1.6}
.empty b{display:block;font-family:var(--f-display);font-size:18px;color:var(--fg);margin-bottom:6px}
.fab{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:18px;
  width:58px;height:58px;border-radius:18px;background:var(--accent);color:#141218;font-size:30px;line-height:1;
  box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5}
.fab:disabled{opacity:.4}
.count{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:22px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);z-index:5;pointer-events:none}
#month{position:absolute;inset:0;overflow-y:auto;padding-block:4px 90px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mwrap{max-width:720px;margin:0 auto}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk span{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;letter-spacing:.1em;padding:4px 0}
.cell{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--stage);position:relative;overflow:hidden;text-align:left}
.cell.out{visibility:hidden}
.cell .n{position:absolute;left:6px;top:4px;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:4}
.cell.today .n{color:var(--accent)}
.cell.has{background:var(--surface)}
.cell .th{position:absolute;inset:16px 3px 3px;display:grid;place-items:center}
.cell .th img{position:absolute;max-width:62%;max-height:62%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.cell .more{position:absolute;right:5px;bottom:3px;font-family:var(--f-mono);font-size:10px;color:var(--muted);z-index:4}
.msum{font-size:13px;color:var(--muted);margin:14px 4px 0}
.scrim{position:fixed;inset:0;background:rgba(8,7,10,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-size:18px;margin:0}
.sheet p.note{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.preview{height:180px;display:grid;place-items:center;background:var(--stage);border-radius:14px}
.preview img{max-height:160px;max-width:80%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
label{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-transform:none;letter-spacing:0;width:100%}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:500;text-align:center;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);color:#141218;border-color:var(--accent)}
.btn.del{color:var(--danger)}
.btn:disabled{opacity:.5}
.err{color:var(--danger);font-size:13px;margin:0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap}
.progress{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center}
/* 화면이 낮을 때(가로로 눕힌 커버 화면 등) 위쪽을 줄여 선반을 키워요 */
@media (max-height:560px){.brand .logo{width:26px;height:26px;border-radius:7px}.bar{padding-block:6px 2px}.brand small{display:none}.datebar{padding-block:0 4px}.dlabel b{font-size:18px}.dlabel span{display:none}.datebar button.nav{width:36px;height:36px}}
/* 펼친 화면처럼 넓을 때 위쪽 막대를 가운데로 모아요 */
@media (min-width:700px){.bar,.datebar{max-width:760px;width:100%;margin-inline:auto}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.login img{width:84px;height:84px;border-radius:22px;image-rendering:pixelated}
.login h1{font-family:var(--f-display);font-size:26px;margin:0}
.login p{color:var(--muted);line-height:1.6;margin:0;max-width:30em;font-size:14px}
.login .btn{flex:none;min-width:220px}
</style>
</head>
<body>

<div class="login" id="login">
  <img src="icon-512.png" alt="">
  <h1>취향 진열장</h1>
  <p id="loginText">마음에 드는 물건을 선반에 올려두는 곳이에요.<br>사진은 내 구글 드라이브의 '취향 진열장' 폴더에만 저장돼요.</p>
  <button class="btn pri" id="loginBtn">구글 계정으로 시작하기</button>
  <p class="err" id="loginErr" hidden></p>
</div>

<header class="bar">
  <button class="brand" id="menuBtn" aria-label="메뉴"><img class="logo" src="icon-192.png" alt=""><span class="bt"><small>Sirius · Drive</small>취향 진열장</span></button>
  <div class="seg" role="group" aria-label="보기">
    <button id="vDay" aria-pressed="true">하루</button>
    <button id="vMonth" aria-pressed="false">한 달</button>
  </div>
</header>
<div class="datebar">
  <button class="nav" id="prev" aria-label="이전">‹</button>
  <button class="dlabel" id="dLabel" aria-label="오늘로 가기"><b id="dTitle">—</b><span id="dSub"></span></button>
  <button class="nav" id="next" aria-label="다음">›</button>
</div>
<div class="status" id="status" hidden><p id="statusText"></p><button id="statusBtn" hidden>다시 시도</button></div>
<main>
  <div id="stage">
    <div id="board">
      <div class="empty" id="empty"><div><b>이날의 선반이 비어 있어요</b>+ 를 눌러 누끼 딴 물건을 올려보세요.<br>끌어서 옮기고, 두 손가락으로 크기와 각도를 바꿔요.<br>빈 곳을 옆으로 밀면 다른 날로 넘어가요.</div></div>
    </div>
  </div>
  <div id="month" hidden></div>
  <div class="count" id="count"></div>
  <button class="fab" id="fab" aria-label="물건 올리기">+</button>
  <input type="file" id="file" accept="image/*" multiple hidden>
</main>

<script>
/* ▼▼▼ 구글 클라우드에서 받은 클라이언트 ID ▼▼▼ */
const CLIENT_ID = "547972278426-eash322ea8031srvh4pqqu4qkm0pj5dl.apps.googleusercontent.com";
/* ▲▲▲ ▲▲▲ */

const SCOPE = "https://www.googleapis.com/auth/drive.file";
const FOLDER_NAME = "취향 진열장";
const API = "https://www.googleapis.com/drive/v3";
const BOARD_RATIO = 3/4;                 // 모든 기기에서 같은 배치가 되도록 선반 비율을 고정
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(_){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(_){}}, del(k){try{localStorage.removeItem(k)}catch(_){}}};

let token=null, tokenExp=0, tokenClient=null, folderId=null;
let items=[];                 // {id, meta:{n,m,d,x,y,s,r,z}}
const imgs=new Map();         // id -> objectURL
let view="day", cur=today(), ready=false, loading=false, lastLoad=0;
let pendingSaves=0, uploading=0;
const WD=["일","월","화","수","목","금","토"];

function today(){return ymd(new Date())}
function ymd(t){return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function parse(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||"")}
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
function setStatus(text,action,label){$("status").hidden=!text;$("statusText").textContent=text||"";$("statusBtn").hidden=!action;$("statusBtn").onclick=action||null;$("statusBtn").textContent=label||"다시 시도";requestAnimationFrame(layout)}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function num(v,d){return typeof v==="number"&&isFinite(v)?v:d}

/* ================= 구글 로그인 ================= */
let tokenWaiters=[], authTries=0;
function showLoginErr(t){$("loginErr").hidden=!t;$("loginErr").textContent=t||""}
function initAuth(){
  if(!window.google||!google.accounts||!google.accounts.oauth2){
    authTries++;
    if(authTries===50) showLoginErr("구글 로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나, 광고 차단 확장 프로그램을 이 사이트에서 끄고 새로고침해 주세요.");
    setTimeout(initAuth,200);return}
  if(tokenClient) return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPE,
    callback:r=>{
      if(r.error){authFail(r.error);return}
      if(google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(r,SCOPE)){authFail("scope");return}
      token=r.access_token; tokenExp=Date.now()+(Number(r.expires_in)||3600)*1000-60000;
      store.set("signedIn","1"); store.set("tok",JSON.stringify({t:token,e:tokenExp}));
      const w=tokenWaiters;tokenWaiters=[];w.forEach(f=>f.res(token));
      setStatus("");
      if(!ready) start();
    },
    error_callback:e=>authFail(e&&e.type)
  });
}
function authFail(code){
  const w=tokenWaiters;tokenWaiters=[];w.forEach(f=>f.rej({code:"auth"}));
  if(ready){ // 쓰는 중이면 화면은 그대로 두고 위쪽에 안내
    setStatus(code==="popup_failed_to_open"?"로그인 창이 차단됐어요. 주소창의 팝업 차단을 허용해 주세요.":"구글 연결이 끊겼어요.",reconnect,"다시 연결");return}
  $("login").hidden=false;
  showLoginErr(code==="popup_closed"||code==="access_denied"?"로그인이 취소됐어요. 다시 눌러 주세요."
    :code==="scope"?"드라이브 접근을 허용해야 쓸 수 있어요. 다시 눌러서 체크박스를 켜 주세요."
    :code==="popup_failed_to_open"?"로그인 창이 차단됐어요. 주소창 오른쪽의 팝업 차단 아이콘을 눌러 허용해 주세요."
    :"로그인하지 못했어요 ("+(code||"알 수 없음")+"). 다시 시도해 주세요.");
}
$("loginBtn").onclick=()=>{
  if(!tokenClient){showLoginErr(authTries>=50?"구글 로그인 도구가 차단되어 있어요. 광고 차단을 끄고 새로고침해 주세요.":"구글 로그인 도구를 불러오는 중이에요. 잠시 후 다시 눌러 주세요.");return}
  showLoginErr("");
  try{tokenClient.requestAccessToken({prompt:store.get("signedIn")?"":"consent"})}
  catch(err){showLoginErr("로그인 창을 열지 못했어요: "+(err&&err.message||err))}
};
function getToken(){
  if(token&&Date.now()<tokenExp) return Promise.resolve(token);
  return new Promise((res,rej)=>{
    tokenWaiters.push({res,rej});
    setStatus("구글 연결이 만료됐어요. 보안을 위해 한 시간에 한 번 다시 연결해야 해요.",reconnect,"다시 연결");
  });
}
function reconnect(){if(!tokenClient){toast("잠시 후 다시 눌러 주세요");return}try{tokenClient.requestAccessToken({prompt:""})}catch(_){}}
function signOut(){
  try{if(token&&google.accounts.oauth2.revoke)google.accounts.oauth2.revoke(token,()=>{})}catch(_){}
  ["tok","signedIn","folderId"].forEach(store.del);
  if(typeof caches!=="undefined")caches.delete("shelf-img").catch(()=>{});
  location.reload();
}

/* ================= 드라이브 ================= */
async function drive(path,opts={},isRetry){
  const t=await getToken();
  let r;
  try{r=await fetch(path.startsWith("http")?path:API+path,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+t}})}
  catch(_){throw{code:"offline"}}
  if(r.status===401&&!isRetry){token=null;store.del("tok");return drive(path,opts,true)}
  if((r.status===429||r.status>=500)&&!isRetry&&(!opts.method||opts.method==="GET")){await new Promise(z=>setTimeout(z,800+Math.random()*700));return drive(path,opts,true)}
  if(!r.ok){let msg="",reason="";try{const j=await r.json();msg=j.error.message;reason=(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||""}catch(_){}throw{code:r.status,message:msg,reason}}
  return r;
}
function errText(e){
  if(e&&e.code==="offline"||!navigator.onLine) return "인터넷에 연결되어 있지 않아요. 연결되면 다시 시도해 주세요.";
  if(e&&e.code==="auth") return "구글 로그인이 필요해요.";
  if(e&&e.code===403&&/storageQuota|quota/i.test(e.reason+e.message)) return "구글 드라이브 저장 공간이 가득 찼어요.";
  if(e&&(e.code===403||e.code===401)) return "드라이브 접근이 거부됐어요. 다시 연결해 주세요.";
  if(e&&e.code===404) return "드라이브에서 파일을 찾지 못했어요. 다른 기기에서 지웠을 수 있어요.";
  if(e&&(e.code>=500||e.code===429)) return "구글 드라이브가 잠시 바빠요. 잠시 후 다시 시도해 주세요.";
  return "드라이브와 통신하지 못했어요"+(e&&e.message?": "+e.message:".");
}
async function ensureFolder(){
  const saved=store.get("folderId");
  if(saved){try{const f=await (await drive(`/files/${saved}?fields=id,trashed`)).json();if(!f.trashed)return saved}catch(e){if(e&&e.code!==404)throw e}}
  const q=encodeURIComponent(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const j=await (await drive(`/files?q=${q}&fields=files(id,createdTime)&orderBy=createdTime&spaces=drive`)).json();
  let id=j.files&&j.files[0]&&j.files[0].id;   // 여러 기기에서 동시에 만들었어도 가장 오래된 폴더 하나만 써요
  if(!id){
    const c=await drive("/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:FOLDER_NAME,mimeType:"application/vnd.google-apps.folder",description:"취향 진열장 앱이 만든 폴더예요. 사진의 '설명'에 위치·날짜·메모가 저장돼 있으니 설명은 지우지 말아 주세요."})});
    id=(await c.json()).id;
  }
  store.set("folderId",id);return id;
}
function readMeta(f){
  let m={};try{m=JSON.parse(f.description||"{}")}catch(_){}
  const d=validDate(m.d)?m.d:(f.createdTime?ymd(new Date(f.createdTime)):today());
  return{n:typeof m.n==="string"?m.n:"",m:typeof m.m==="string"?m.m:"",d,x:clamp(num(m.x,.5),0,1),y:clamp(num(m.y,.5),0,1),s:clamp(num(m.s,.38),.06,1.4),r:num(m.r,0),z:num(m.z,1)};
}
async function fetchList(){
  const all=[];let pt="";
  do{
    const q=encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType contains 'image/'`);
    const j=await (await drive(`/files?q=${q}&pageSize=500&fields=nextPageToken,files(id,description,createdTime)${pt?"&pageToken="+pt:""}`)).json();
    (j.files||[]).forEach(f=>all.push(f));pt=j.nextPageToken||"";
  }while(pt);
  return all.map(f=>({id:f.id,meta:readMeta(f)}));
}

async function refresh(){

  if(Date.now()-lastLoad<15000) return;

/* ---- 이미지: 한 번 받은 사진은 기기에 저장해 두고 다시 받지 않아요 ---- */
const pending=new Map();let active=0;const queue=[];
async function cacheGet(id){try{const c=await caches.open("shelf-img");const r=await c.match("img/"+id);return r?await r.blob():null}catch(_){return null}}
async function cachePut(id,blob){try{const c=await caches.open("shelf-img");await c.put("img/"+id,new Response(blob,{headers:{"Content-Type":blob.type||"image/png"}}))}catch(_){}}
async function cacheDel(id){try{const c=await caches.open("shelf-img");await c.delete("img/"+id)}catch(_){}}
function getImg(id){
  if(imgs.has(id))return Promise.resolve(imgs.get(id));
  if(pending.has(id))return pending.get(id);
  const p=(async()=>{
    const hit=await cacheGet(id);
    if(hit){const u=URL.createObjectURL(hit);imgs.set(id,u);return u}
    return new Promise((res,rej)=>{queue.push({id,res,rej});pump()});
  })();
  pending.set(id,p);p.catch(()=>pending.delete(id));return p;
}
function pump(){
  while(active<4&&queue.length){
    const{id,res,rej}=queue.shift();active++;
    drive(`/files/${id}?alt=media`).then(r=>r.blob()).then(b=>{cachePut(id,b);const u=URL.createObjectURL(b);imgs.set(id,u);res(u)})
      .catch(rej).finally(()=>{active--;pump()});
  }
}

/* ================= 화면 ================= */
function layout(){
  const st=$("stage"),b=$("board");if(st.hidden)return;
  const pad=12,SW=st.clientWidth,SH=st.clientHeight;
  if(!SW||!SH)return;
  // 먼저 전체 높이로 맞춰 보고, + 버튼과 겹치면 그만큼 아래를 비워요.
  // 펼친 화면처럼 옆에 여백이 넉넉하면 버튼이 여백에 들어가니 비우지 않아요.
  const fit=(H)=>{let w=Math.min(SW-pad*2,H*BOARD_RATIO);w=Math.max(120,w);return w};
  let w=fit(SH-pad*2);
  const sideFree=(SW-w)/2;
  let reserve=0;
  if(sideFree<86){reserve=76;w=fit(SH-pad*2-reserve)}
  const h=w/BOARD_RATIO;
  b.style.width=w+"px";b.style.height=h+"px";b.style.marginBottom=reserve+"px";
  b.querySelectorAll(".item").forEach(el=>{const it=items.find(i=>i.id===el.dataset.id);if(it)place(el,it)});
}
function render(){
  $("vDay").setAttribute("aria-pressed",view==="day");$("vMonth").setAttribute("aria-pressed",view==="month");
  $("stage").hidden=view!=="day";$("month").hidden=view!=="month";
  const d=parse(cur);
  if(view==="day"){
    $("dTitle").textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일";
    $("dSub").textContent=d.getFullYear()+" · "+WD[d.getDay()]+"요일"+(cur===today()?" · 오늘":"");
    layout();renderDay();
  }else{
    $("dTitle").textContent=d.getFullYear()+"년 "+(d.getMonth()+1)+"월";
    $("dSub").textContent=ymd(new Date()).slice(0,7)===cur.slice(0,7)?"이번 달":"날짜를 누르면 그날 선반이 열려요";
    renderMonth();
  }
}
function renderDay(){
  const b=$("board");b.querySelectorAll(".item").forEach(e=>e.remove());
  const list=items.filter(i=>i.meta.d===cur).sort((a,c)=>a.meta.z-c.meta.z);
  $("empty").hidden=list.length>0;
  $("count").textContent=list.length?String(list.length).padStart(2,"0")+" OBJECTS":"";
  list.forEach(it=>{
    const el=document.createElement("div");el.className="item ph";el.dataset.id=it.id;
    b.appendChild(el);place(el,it);bind(el,it);
    getImg(it.id).then(u=>{if(!el.isConnected)return;el.classList.remove("ph");const im=new Image();im.alt=it.meta.n||"물건";im.draggable=false;im.src=u;el.appendChild(im)})
      .catch(()=>{if(!el.isConnected)return;el.classList.remove("ph");el.classList.add("bad");el.textContent="불러오지 못함";});

}
function place(el,it){
  const b=$("board"),W=b.clientWidth,H=b.clientHeight,w=it.meta.s*W;
  el.style.width=w+"px";el.style.zIndex=Math.round(it.meta.z);
  el.style.transform=`translate(${it.meta.x*W-w/2}px,${it.meta.y*H-w/2}px) rotate(${it.meta.r}deg)`;
}
function renderMonth(){
  const box=$("month");box.innerHTML="";const wrap=document.createElement("div");wrap.className="mwrap";box.appendChild(wrap);
  const d=parse(cur),y=d.getFullYear(),mo=d.getMonth();

    if(its.length>3){const m=document.createElement("span");m.className="more";m.textContent="+"+(its.length-3);c.appendChild(m)}

  }
  const s=document.createElement("p");s.className="msum";s.textContent=total?`이 달에 ${total}개를 모았어요.`:"이 달엔 아직 모은 물건이 없어요.";wrap.appendChild(s);

let dragging=false;
function topZ(){return Math.max(0,...items.map(i=>i.meta.z))}
function bind(el,it){
  const pts=new Map();let st=null,moved=false,t0=0;
  const geom=()=>{const a=[...pts.values()];
    if(a.length<2)return{cx:a[0].x,cy:a[0].y};
    return{cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,dist:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),ang:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x)}};
  const begin=()=>{st={m:{...it.meta},g:geom()}};
  el.addEventListener("pointerdown",e=>{
    if(e.button>0)return;
    e.preventDefault();e.stopPropagation();
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){moved=false;t0=Date.now();dragging=true;el.classList.add("active")}
    begin();
  });
  el.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)||!st)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const b=$("board"),W=b.clientWidth,H=b.clientHeight,g=geom();
    const dx=g.cx-st.g.cx,dy=g.cy-st.g.cy;
    if(!moved&&(Math.hypot(dx,dy)>6||pts.size>1)){moved=true;if(it.meta.z<topZ()){it.meta.z=topZ()+1}}
    if(!moved)return;
    it.meta.x=clamp(st.m.x+dx/W,0,1);it.meta.y=clamp(st.m.y+dy/H,0,1);
    if(g.dist&&st.g.dist){it.meta.s=clamp(st.m.s*g.dist/st.g.dist,.06,1.4);it.meta.r=st.m.r+(g.ang-st.g.ang)*180/Math.PI}
    place(el,it);
  });
  const end=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size){begin();return}
    el.classList.remove("active");st=null;dragging=false;
    if(!moved&&Date.now()-t0<450){openItem(it);return}
    if(moved)saveMeta(it);
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("contextmenu",e=>e.preventDefault());
  // PC: 휠로 크기, Shift+휠로 회전
  let wheelT=null;
  el.addEventListener("wheel",e=>{
    e.preventDefault();
    if(e.shiftKey) it.meta.r+=(e.deltaY>0?4:-4);
    else it.meta.s=clamp(it.meta.s*(e.deltaY>0?.94:1.06),.06,1.4);
    place(el,it);clearTimeout(wheelT);wheelT=setTimeout(()=>saveMeta(it),500);
  },{passive:false});
}
/* 빈 곳을 옆으로 밀면 다른 날로 */
(function swipe(){
  let sx=0,sy=0,on=false;
  $("stage").addEventListener("pointerdown",e=>{if(e.target.closest(".item"))return;on=true;sx=e.clientX;sy=e.clientY});
  $("stage").addEventListener("pointerup",e=>{if(!on)return;on=false;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dy)<60)shift(dx<0?1:-1)});
  $("stage").addEventListener("pointercancel",()=>on=false);
})();
function metaStr(m){const r=v=>Math.round(v*1000)/1000;return JSON.stringify({v:1,n:m.n,m:m.m,d:m.d,x:r(m.x),y:r(m.y),s:r(m.s),r:Math.round(((m.r%360)+360)%360*10)/10,z:m.z})}
function patch(id,body){return drive(`/files/${id}?fields=id`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}
const saving=new Map();
function saveMeta(it){
  pendingSaves++;
  const p=(saving.get(it.id)||Promise.resolve())
    .then(()=>patch(it.id,{description:metaStr(it.meta)}))
    .catch(e=>{toast(e&&e.code==="offline"?"오프라인이라 배치를 저장하지 못했어요":"배치를 저장하지 못했어요")})
    .finally(()=>{pendingSaves--});

}

let openSheets=0,ignorePop=0;
function sheet(html){
  const s=document.createElement("div");s.className="scrim";
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(s);openSheets++;
  try{history.pushState({sheet:openSheets},"")}catch(_){}
  s.close=()=>{if(!s.isConnected)return;s.remove();openSheets--;if(history.state&&history.state.sheet){ignorePop++;try{history.back()}catch(_){ignorePop--}}};
  s.addEventListener("click",e=>{if(e.target===s&&!s.busy)s.close()});
  return s;
}

      for(let i=done;i<blobs.length;i++){
        b.textContent=multi?`올리는 중… ${i+1}/${blobs.length}`:"올리는 중…";
        const k=i-(blobs.length-1)/2;
        const meta={n:multi?"":q("nName").value.trim(),m:multi?"":q("nMemo").value.trim(),d:day,
          x:clamp(.5+k*.12+(Math.random()-.5)*.08,.1,.9),y:clamp(.45+(Math.random()-.5)*.2,.15,.85),s:multi?.3:.38,r:(Math.random()-.5)*8,z:topZ()+1};
        const form=new FormData();
        form.append("metadata",new Blob([JSON.stringify({name:safeName(meta.n),parents:[folderId],description:metaStr(meta)})],{type:"application/json"}));
        form.append("file",blobs[i]);
        const j=await (await drive("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:form})).json();
        cachePut(j.id,blobs[i]);imgs.set(j.id,URL.createObjectURL(blobs[i]));items.push({id:j.id,meta});done=i+1;
      }
      s.busy=false;s.close();toast(multi?`${blobs.length}개를 선반에 올렸어요`:"선반에 올렸어요");
      cur=day;view="day";render();
    }catch(e2){
      s.busy=false;q("nCancel").disabled=false;b.disabled=false;
      b.textContent=done?`나머지 ${blobs.length-done}장 다시 올리기`:"다시 올리기";
      q("nErr").hidden=false;q("nErr").textContent=errText(e2)+(done?` (${done}장은 올라갔어요)`:"");
      if(done)render();
    }finally{uploading--}
  };
};
function shrink(src,max){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(src);const im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(),"image/png")};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

/* ================= 날짜 이동 ================= */
$("vDay").onclick=()=>{view="day";render()};
$("vMonth").onclick=()=>{view="month";render()};
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("dLabel").onclick=()=>{if(cur!==today()){cur=today();render();toast("오늘로 돌아왔어요")}};
document.addEventListener("keydown",e=>{if(document.querySelector(".scrim")||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowLeft")shift(-1);if(e.key==="ArrowRight")shift(1)});
function shift(k){const d=parse(cur);if(view==="day")d.setDate(d.getDate()+k);else{d.setDate(1);d.setMonth(d.getMonth()+k)}cur=ymd(d);render()}
/* 자정이 지나면 '오늘' 표시를 갱신 */
setInterval(()=>{const t=today();if(t!==render.lastToday){const wasToday=cur===render.lastToday;render.lastToday=t;if(wasToday)cur=t;if(ready)render()}},60000);
render.lastToday=today();

/* ================= 시작 ================= */
render();
initAuth();
(function resume(){
  let saved=null;try{saved=JSON.parse(store.get("tok")||"null")}catch(_){}
  if(saved&&saved.t&&saved.e>Date.now()){token=saved.t;tokenExp=saved.e;$("login").hidden=true;start()}
  else if(store.get("signedIn")){
    $("loginBtn").textContent="이어서 열기";
    $("loginText").textContent="진열장은 드라이브에 그대로 있어요. 보안을 위해 한 시간에 한 번 눌러 주세요.";
  }
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
