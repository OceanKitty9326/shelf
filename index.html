/* ================= 텍스트 ================= */
/* 글자는 '설계 크기(BASE)'로 배치를 계산한 뒤 통째로 키우고 줄여요.
   화면과 공유 이미지가 같은 계산을 써서 줄바꿈과 형광펜 위치가 똑같이 나와요. */
const T_BASE=300, T_SIZE=28, T_LH=1.4, T_MAXW=300;
const T_FONTS={sans:{css:'"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',label:"고딕",w:[400,700]},
               serif:{css:'"Nanum Myeongjo","Apple SD Gothic Neo",serif',label:"명조",w:[400,800]},
               galmuri:{css:'"Galmuri9","Galmuri11",monospace',label:"갈무리",w:[400,700]}};
const T_COLORS={white:"#ece8f2",black:"#1b1820",sky:"#b4c8ff",pink:"#f4a7b9",yellow:"#f6d365",green:"#9bd3a8",red:"#ff8a80",gray:"#8e889b"};
const T_COLOR_NAMES={white:"흰색",black:"검정",sky:"하늘",pink:"분홍",yellow:"노랑",green:"초록",red:"빨강",gray:"회색"};
const T_HL={yellow:"rgba(246,211,101,.6)",pink:"rgba(244,167,185,.6)",sky:"rgba(160,190,255,.55)",green:"rgba(155,211,168,.6)"};
const T_SHAPES={none:{label:"글자만",padX:6,padY:4,bg:null,minW:0},
                label:{label:"라벨",padX:18,padY:10,bg:"#f1ece2",minW:0,radius:8},
                note:{label:"포스트잇",padX:22,padY:22,bg:"#f7e08a",minW:170,radius:3}};
function defStyle(){return{sh:"none",co:"white",b:false,f:"sans",hl:""}}
function readStyle(st){const d=defStyle();if(!st||typeof st!=="object")return d;
  return{sh:T_SHAPES[st.sh]?st.sh:d.sh,co:T_COLORS[st.co]?st.co:d.co,b:!!st.b,f:T_FONTS[st.f]?st.f:d.f,hl:T_HL[st.hl]?st.hl:""}}
function isText(it){return it&&it.meta&&it.meta.k==="text"}
function tFont(st){const f=T_FONTS[st.f];return `${st.b?f.w[1]:f.w[0]} ${T_SIZE}px ${f.css}`}
const _mc=document.createElement("canvas").getContext("2d");
/* 형광펜: ==감싼 부분==이 있으면 그 부분만, 없으면 전체 */
function tChars(text,st){
  const out=[];const hasMark=/==[^=]+==/.test(text);
  if(!st.hl){for(const ch of text.replace(/==/g,""))out.push({ch,h:false});return out}
  if(!hasMark){for(const ch of text)out.push({ch,h:ch!=="\n"});return out}
  let on=false;for(let i=0;i<text.length;i++){if(text[i]==="="&&text[i+1]==="="){on=!on;i++;continue}out.push({ch:text[i],h:on&&text[i]!=="\n"})}
  return out;
}
function layoutText(meta){
  const st=readStyle(meta.st),shape=T_SHAPES[st.sh];
  _mc.font=tFont(st);
  const lh=Math.round(T_SIZE*T_LH),maxW=T_MAXW-shape.padX*2;
  const chars=tChars(meta.tx||"",st);
  const W=s=>_mc.measureText(s).width;
  // 문단 → 단어 단위로 줄바꿈 (한 단어가 너무 길면 글자 단위)
  const lines=[];let line=[];
  const lineW=l=>W(l.map(c=>c.ch).join(""));
  const pushLine=()=>{while(line.length&&line[line.length-1].ch===" ")line.pop();lines.push(line);line=[]};
  const paras=[];let p=[];for(const c of chars){if(c.ch==="\n"){paras.push(p);p=[]}else p.push(c)}paras.push(p);
  for(const para of paras){
    const words=[];let w=[];for(const c of para){w.push(c);if(c.ch===" "){words.push(w);w=[]}}if(w.length)words.push(w);
    for(const word of words){
      if(lineW(line.concat(word))<=maxW){line=line.concat(word);continue}
      if(line.length)pushLine();
      if(lineW(word)<=maxW){line=word.slice();continue}
      for(const c of word){if(lineW(line.concat([c]))>maxW&&line.length)pushLine();line.push(c)}
    }
    pushLine();
  }
  if(!lines.length)lines.push([]);
  const widths=lines.map(lineW);
  const contentW=Math.max(1,...widths);
  const w=Math.max(shape.minW,Math.ceil(contentW+shape.padX*2)),h=Math.ceil(lines.length*lh+shape.padY*2);
  // 줄마다 가운데 정렬, 형광펜 구간 위치
  const L=lines.map((l,i)=>{
    const text=l.map(c=>c.ch).join("");const x0=(w-widths[i])/2;const y=shape.padY+i*lh;
    const hls=[];let start=-1;
    for(let k=0;k<=l.length;k++){const on=k<l.length&&l[k].h&&!(l[k].ch===" "&&(k===l.length-1||!l[k+1]||!l[k+1].h));
      if(on&&start<0)start=k;
      if(!on&&start>=0){const a=W(l.slice(0,start).map(c=>c.ch).join("")),b=W(l.slice(0,k).map(c=>c.ch).join(""));hls.push([x0+a-2,b-a+4]);start=-1}}
    return{text,x:x0,y,hls};
  });
  return{st,shape,w,h,lh,lines:L,font:tFont(st),color:T_COLORS[st.co]};
}
/* 화면에 그리기 (설계 크기로 그린 뒤 scale) */
function buildTextDom(meta){
  const lay=layoutText(meta);
  const box=document.createElement("div");box.className="tin sh-"+lay.st.sh;
  box.style.width=lay.w+"px";box.style.height=lay.h+"px";
  if(lay.shape.bg){box.style.background=lay.shape.bg;box.style.borderRadius=lay.shape.radius+"px"}
  let html="";
  lay.lines.forEach(l=>{l.hls.forEach(([x,w])=>{html+=`<i class="thl" style="left:${x}px;top:${l.y+lay.lh*.42}px;width:${w}px;height:${lay.lh*.5}px;background:${T_HL[lay.st.hl]}"></i>`});
    html+=`<span class="tln" style="left:${l.x}px;top:${l.y}px;line-height:${lay.lh}px;font:${esc(lay.font)};color:${lay.color}">${esc(l.text)||"&nbsp;"}</span>`});
  box.innerHTML=html;return{box,lay};
}
function placeText(el,it,W,H){
  const k=it.meta.s*W/T_BASE;
  let box=el.firstElementChild;
  if(!box||el._tkey!==textKey(it.meta)){const r=buildTextDom(it.meta);el.querySelectorAll(".tin").forEach(x=>x.remove());el.prepend(r.box);el._lay=r.lay;el._tkey=textKey(it.meta);box=r.box}
  const lay=el._lay,w=lay.w*k,h=lay.h*k;
  box.style.transform=`scale(${k})`;
  el.style.width=w+"px";el.style.height=h+"px";el.style.zIndex=zRank(it);
  el.style.transform=`translate(${it.meta.x*W-w/2}px,${it.meta.y*H-h/2}px) rotate(${it.meta.r}deg)`;
}
function textKey(m){return JSON.stringify([m.tx,m.st])}
/* 공유 이미지에 그리기: 화면과 같은 계산 */
function drawTextItem(g,it,ox,oy,BW,BH){
  const lay=layoutText(it.meta),k=it.meta.s*BW/T_BASE;
  g.save();g.translate(ox+it.meta.x*BW,oy+it.meta.y*BH);g.rotate(it.meta.r*Math.PI/180);g.scale(k,k);g.translate(-lay.w/2,-lay.h/2);
  if(lay.shape.bg){g.save();g.shadowColor="rgba(0,0,0,.35)";g.shadowBlur=14;g.shadowOffsetY=8;g.fillStyle=lay.shape.bg;rrect(g,0,0,lay.w,lay.h,lay.shape.radius);g.fill();g.restore()}
  g.textBaseline="middle";g.font=lay.font;
  lay.lines.forEach(l=>{
    l.hls.forEach(([x,w])=>{g.fillStyle=T_HL[lay.st.hl];g.fillRect(x,l.y+lay.lh*.42,w,lay.lh*.5)});
    g.fillStyle=lay.color;
    if(!lay.shape.bg){g.save();g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=8;g.shadowOffsetY=3;g.fillText(l.text,l.x,l.y+lay.lh/2);g.restore()}
    else g.fillText(l.text,l.x,l.y+lay.lh/2);
  });
  g.restore();
}
/* 글씨체가 늦게 도착하면 다시 그려요 */
if(document.fonts){document.fonts.addEventListener&&document.fonts.addEventListener("loadingdone",()=>{if(view==="month")document.querySelectorAll("#month .mi.text").forEach(el=>{el._tkey=null;const m=el.parentNode;miniPlace(el,el._it,m.clientWidth,m.clientWidth/BOARD_RATIO)});if(view==="day")document.querySelectorAll(".item.text").forEach(el=>{el._tkey=null;const it=items.find(i=>i.id===el.dataset.id);if(it)place(el,it)})})}
function loadTextFonts(){if(!document.fonts)return Promise.resolve();return Promise.all(Object.keys(T_FONTS).flatMap(f=>[400,700].map(w=>document.fonts.load(`${w} ${T_SIZE}px ${T_FONTS[f].css.split(",")[0]}`,"가A").catch(()=>{}))))}

/* ================= 이미지 도구 ================= */
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function shrink(src,max,type){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(src);const im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(),type||"image/png",.9)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
/* 이미 배경이 투명한 사진(직접 누끼 딴 PNG)인지 확인 */
function hasAlpha(blob){return new Promise(res=>{
  const u=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>{const c=document.createElement("canvas");const k=Math.min(1,200/Math.max(im.naturalWidth,im.naturalHeight));
    c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const g=c.getContext("2d");g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    const d=g.getImageData(0,0,c.width,c.height).data;let t=0;for(let i=3;i<d.length;i+=4)if(d[i]<20)t++;

/* 물건 둘레의 투명한 여백을 잘라내요. 잘라낸 위치(x,y)도 돌려줘서 다시 다듬을 때 맞춰요 */
function trimInfo(blob){return new Promise((res)=>{
  const u=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;
    const g=c.getContext("2d");g.drawImage(im,0,0);URL.revokeObjectURL(u);
    const {width:w,height:h}=c;const d=g.getImageData(0,0,w,h).data;
    let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1<0){res({blob,x:0,y:0,empty:true});return}
    const pad=Math.round(Math.max(x1-x0,y1-y0)*0.03);
    x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
    if(x0===0&&y0===0&&x1===w-1&&y1===h-1){res({blob,x:0,y:0});return}
    const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;
    o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
    o.toBlob(b=>res({blob:b||blob,x:x0,y:y0}),"image/png")};
  im.onerror=()=>{URL.revokeObjectURL(u);res({blob,x:0,y:0})};im.src=u})}

/* ================= 편집 화면: 자르기 → 배경 지우기 → 다듬기 ================= */

function openEditor(blob,opts={}){

    if(!crop&&RT)crop=fitRatio();

    function baseSize(){const a=q("eArea"),W=a.clientWidth-8,H=a.clientHeight-8;const w0=step===1?IW:crop.w,h0=step===1?IH:crop.h;const k=Math.min(W/w0,H/h0);return{w:Math.round(w0*k),h:Math.round(h0*k),W:a.clientWidth,H:a.clientHeight}}

    area.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
    (function mousePan(){let on=false,sx=0,sy=0,tx0=0,ty0=0;
      area.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||(e.button!==2&&e.button!==1))return;e.preventDefault();on=true;sx=e.clientX;sy=e.clientY;tx0=TX;ty0=TY;try{area.setPointerCapture(e.pointerId)}catch(_){}});

      area.addEventListener("pointerup",()=>on=false);area.addEventListener("contextmenu",e=>e.preventDefault());})();

    /* ---- 1단계: 자르기 ---- */
    function kk(){return q("eWrap").getBoundingClientRect().width/IW}    // 화면 1px이 원본 몇 px인지 (확대 포함)
    function drawCrop(){
      if(step!==1)return;const k=q("eWrap").clientWidth/IW,c=q("eCrop");
      c.style.left=crop.x*k+"px";c.style.top=crop.y*k+"px";c.style.width=crop.w*k+"px";c.style.height=crop.h*k+"px";
      // 확대해도 모서리 손잡이 크기는 그대로 보이게

    }
    (function cropDrag(){
      const c=q("eCrop");let mode=null,st=null,pid=null;
      c.addEventListener("pointerdown",e=>{
        if(gesturing||e.button>0)return;e.preventDefault();pid=e.pointerId;try{c.setPointerCapture(pid)}catch(_){}
        mode=e.target.dataset.h||"move";st={x:e.clientX,y:e.clientY,c:{...crop}};
        cancelActive=()=>{if(st){crop={...st.c};drawCrop()}mode=null;st=null};
      });
      c.addEventListener("pointermove",e=>{
        if(!mode||gesturing||e.pointerId!==pid)return;const k=kk(),dx=(e.clientX-st.x)/k,dy=(e.clientY-st.y)/k,o=st.c,MIN=Math.max(16,Math.min(IW,IH)*0.03);
        let {x,y,w,h}=o;
        if(mode==="move"){x=clamp(o.x+dx,0,IW-o.w);y=clamp(o.y+dy,0,IH-o.h)}
        else if(RT){
          // 비율 고정: 반대쪽 모서리를 기준점으로 두고 크기만 바꿔요
          const E=mode.includes("e"),S=mode.includes("s");
          const ax=E?o.x:o.x+o.w,ay=S?o.y:o.y+o.h;
          const px=(E?o.x+o.w:o.x)+dx,py=(S?o.y+o.h:o.y)+dy;

          if(mode.includes("e")){w=clamp(o.w+dx,MIN,IW-o.x)}

    function cropCanvas(){const c=document.createElement("canvas");c.width=crop.w;c.height=crop.h;c.getContext("2d").drawImage(src.im,crop.x,crop.y,crop.w,crop.h,0,0,crop.w,crop.h);return c}
    function pushHist(){hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(hist.length>25)hist.shift();q("eUndo").disabled=false}
    async function runAI(){

        const b=await new Promise(r=>srcCv.toBlob(r,"image/png"));
        const out=await removeBg(b,()=>{if(!finished)hint.textContent=aiLabel()});
        if(!finished)hint.textContent="배경을 지우는 중이에요…";
        const {im,u}=await loadImg(out);
        if(finished)return;

        hint.textContent="남은 배경은 지우개로, 잘못 지워진 곳은 되살리기로 문질러 주세요.";
      }catch(_){
        if(finished)return;
        hint.textContent="자동으로 지우지 못했어요(인터넷 연결 확인). 지우개로 직접 지울 수 있어요.";
      }finally{if(!finished){q("eNext").disabled=false;q("eRedo").disabled=false}}
    }
    async function toStep2(){
      step=2;q("eTitleT").textContent="배경 다듬기";q("eNext").textContent="완료";
      q("eCrop").hidden=true;q("eImg").hidden=true;q("eTools1").hidden=true;q("eTools2").hidden=false;
      srcCv=cropCanvas();
      cv=q("eCv");cv.hidden=false;cv.width=crop.w;cv.height=crop.h;ctx=cv.getContext("2d",{willReadFrequently:true});
      ctx.drawImage(srcCv,0,0);q("eWrap").classList.add("checker");

      // 다시 다듬기: 자르기를 그대로 두었으면 이전 결과에서 이어서 다듬어요
      if(opts.cut&&JSON.stringify(crop)===crop0){
        try{const {im,u}=await loadImg(opts.cut.blob);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(im,opts.cut.x,opts.cut.y);URL.revokeObjectURL(u);
          q("eHint").textContent="이전에 다듬은 상태예요. 지우개와 되살리기로 고쳐 주세요.";return}catch(_){}
      }

    q("eRedo").onclick=()=>runAI();
    q("eReset").onclick=()=>{pushHist();ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(srcCv,0,0)};
    q("eUndo").onclick=()=>{const d=hist.pop();if(d)ctx.putImageData(d,0,0);q("eUndo").disabled=!hist.length};
    const setTool=t=>{tool=t;q("eErase").setAttribute("aria-pressed",t==="erase");q("eRestore").setAttribute("aria-pressed",t==="restore")};
    q("eErase").onclick=()=>setTool("erase");q("eRestore").onclick=()=>setTool("restore");

    /* 붓: 한 손가락(또는 마우스 왼쪽)으로 문지르기. 동그라미로 붓 크기를 보여줘요 */
    (function brush(){

      });

      c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);

    })();

    q("eNext").onclick=async()=>{
      if(step===1&&opts.cropOnly){

        const k=Math.min(1,1200/crop.w),cv2=document.createElement("canvas");cv2.width=Math.round(crop.w*k);cv2.height=Math.round(crop.h*k);

      if(!out){q("eNext").disabled=false;q("eNext").textContent="완료";return}
      const t=await trimInfo(out);
      if(t.empty){q("eHint").textContent="물건이 전부 지워졌어요. 되돌리기나 되살리기로 살려 주세요.";q("eNext").disabled=false;q("eNext").textContent="완료";return}
      done({cut:t.blob,crop:[crop.x,crop.y,crop.w,crop.h],t:[t.x,t.y]});
    };
  });
}

/* 여러 장 중 '나머지는 자동으로'를 고른 사진들 */
async function autoProcess(x){
  if(x.alpha){const t=await trimInfo(x.orig);return{cut:t.blob,crop:[0,0,x.w,x.h],t:[t.x,t.y]}}
  try{const out=await removeBg(x.orig);const t=await trimInfo(out);if(t.empty)throw 0;return{cut:t.blob,crop:[0,0,x.w,x.h],t:[t.x,t.y]}}
  catch(_){return{cut:x.orig,crop:[0,0,x.w,x.h],t:[0,0]}}
}

  const q=id=>s.querySelector("#"+id);
  const urls=[];const show=b=>{const u=URL.createObjectURL(b);urls.push(u);q("nPv").src=u};
  show(first?first.res.cut:ready2[0].x.orig);
  q("nCancel").onclick=()=>s.close();
  let done=0;
  q("nUp").onclick=async()=>{
    const b=q("nUp");b.disabled=true;q("nCancel").disabled=true;s.busy=true;q("nErr").hidden=true;

          q("nProg").hidden=false;q("nProg").textContent=aiState==="ready"?"":aiLabel();

/* ================= 다시 다듬기 ================= */
async function reEdit(it){
  toast("사진을 불러오는 중…");
  let src=null,cut=null;
  try{cut=await getBlob(it.id)}catch(e){toast(errText(e),3000);return}
  if(it.meta.o){try{src=await getBlob(it.meta.o)}catch(_){src=null}}
  const hasOrig=!!src;
  const r=await openEditor(hasOrig?src:cut,hasOrig
    ?{crop:it.meta.c,cut:it.meta.t?{blob:cut,x:it.meta.t[0],y:it.meta.t[1]}:null}
    :{alreadyCut:true,cut:{blob:cut,x:0,y:0}});
  if(!r||r.auto)return;
  uploading++;setStatus("다듬은 결과를 저장하는 중…");
  try{
    await drive(UPLOAD+`/${it.id}?uploadType=media&fields=id`,{method:"PATCH",headers:{"Content-Type":"image/png"},body:r.cut});
    if(hasOrig){it.meta.c=r.crop;it.meta.t=r.t}
    await patch(it.id,{description:metaStr(it.meta)});
    setImg(it.id,r.cut);setStatus("");toast("다시 다듬었어요");render();
  }catch(e){setStatus(errText(e)+" 다듬은 결과가 저장되지 않았어요.",()=>{setStatus("")},"닫기")}
  finally{uploading--}
}

/* ================= 이미지로 공유하기 ================= */
const SHARE_C={bg:"#141218",board:"#1d1a23",line:"#34303d",fg:"#ece8f2",muted:"#8e889b",accent:"#b4c8ff",cell:"#18161d",cellOn:"#221f29"};
const F_DISPLAY='"Nanum Myeongjo","Apple SD Gothic Neo",serif',F_BODY='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',F_MONO='"IBM Plex Mono",ui-monospace,monospace';
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function imgFromUrl(u){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}
function wrapLines(g,text,maxW,maxLines){
  const words=text.split(" ");const lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w;if(g.measureText(t).width>maxW&&line){lines.push(line);line=w;if(lines.length===maxLines)break}else line=t}
  if(lines.length<maxLines&&line)lines.push(line);
  if(lines.length===maxLines&&words.join(" ")!==lines.join(" ")){let l=lines[maxLines-1];while(g.measureText(l+"…").width>maxW&&l.length)l=l.slice(0,-1);lines[maxLines-1]=l+"…"}
  return lines;
}
const F_GAL='"Galmuri9","Galmuri11",monospace';
async function drawHeader(g,W,title,sub){
  await loadTextFonts();
  try{const logo=await imgFromUrl("icon-192.png");g.imageSmoothingEnabled=false;rrect(g,64,58,76,76,18);g.save();g.clip();g.drawImage(logo,64,58,76,76);g.restore();g.imageSmoothingEnabled=true}catch(_){}
  g.fillStyle=SHARE_C.muted;g.font=`400 24px ${F_GAL}`;g.textBaseline="alphabetic";g.fillText("취향 진열장",162,88);
  g.fillStyle=SHARE_C.fg;g.font=`700 44px ${F_GAL}`;g.fillText(title,160,134);
  if(sub){g.fillStyle=SHARE_C.muted;g.font=`400 24px ${F_GAL}`;g.textAlign="right";g.fillText(sub,W-64,134);g.textAlign="left"}
}
/* 하루 공유 이미지. cells: 넣을 칸 번호들 (여러 개면 세로로 이어 붙여요) */
async function renderDayImage(day,withNames,cells){
  cells=cells&&cells.length?cells:[1];
  const multi=cells.length>1,showLabel=dayCells(day)>1;
  const lists=cells.map(c=>dayOrder(day,c));
  const all=lists.flat();
  const W=1080,pad=64,BW=W-pad*2,BH=Math.round(BW/BOARD_RATIO),LAB=showLabel?54:0,GAP=multi?40:0;
  const names=all.filter(i=>!isText(i)).map(i=>i.meta.n).filter(Boolean);
  const c=document.createElement("canvas");const g=c.getContext("2d");
  g.font=`400 26px ${F_BODY}`;
  const nameLines=withNames&&names.length?wrapLines(g,names.join(" · "),BW,3):[];
  const top=170,footer=70+(nameLines.length?nameLines.length*40+16:0);
  c.width=W;c.height=top+cells.length*(LAB+BH)+(cells.length-1)*GAP+footer+40;
  g.fillStyle=SHARE_C.bg;g.fillRect(0,0,c.width,c.height);
  const d=parse(day);
  await drawHeader(g,W,`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`,`${WD[d.getDay()]}요일`);
  await loadTextFonts();
  let y0=top;
  for(let k=0;k<cells.length;k++){
    const list=lists[k];
    if(showLabel){g.fillStyle=SHARE_C.muted;g.font=`400 26px "Galmuri9","Galmuri11",monospace`;g.textBaseline="alphabetic";g.fillText(`${cells[k]}번 칸`,pad+4,y0+36);y0+=LAB}
    g.save();rrect(g,pad,y0,BW,BH,28);g.clip();
    await drawBoardBg(g,bgFor(day,cells[k]).spec,pad,y0,BW,BH);
    for(const it of list){
      if(isText(it)){drawTextItem(g,it,pad,y0,BW,BH);continue}
      let im;try{im=await imgFromUrl(await getImg(it.id))}catch(_){continue}
      const w=it.meta.s*BW,h=w*im.naturalHeight/im.naturalWidth;
      // 화면과 똑같이: 왼쪽 위 = (x*W - w/2, y*H - w/2), 회전은 물건 가운데 기준
      const cx=pad+it.meta.x*BW,cy=y0+it.meta.y*BH-w/2+h/2;
      g.save();g.translate(cx,cy);g.rotate(it.meta.r*Math.PI/180);
      g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=26;g.shadowOffsetY=18;
      g.drawImage(im,-w/2,-h/2,w,h);g.restore();
    }
    g.restore();
    g.strokeStyle=SHARE_C.line;g.lineWidth=2;rrect(g,pad,y0,BW,BH,28);g.stroke();
    if(!list.length){g.fillStyle=SHARE_C.muted;g.font=`400 28px ${F_BODY}`;g.textAlign="center";g.fillText(showLabel?"비어 있는 칸이에요":"이날의 선반은 비어 있어요",W/2,y0+BH/2);g.textAlign="left"}
    y0+=BH+GAP;
  }
  // 아래쪽
  let y=y0-GAP+56;
  g.fillStyle=SHARE_C.muted;g.font=`500 24px ${F_BODY}`;g.fillText(`진열된 물건 ${all.filter(i=>!isText(i)).length}점`+(showLabel?(multi?` · ${cells.length}칸`:` · ${cells[0]}번 칸`):""),pad,y);
  if(nameLines.length){y+=48;g.fillStyle=SHARE_C.fg;g.font=`400 26px ${F_BODY}`;for(const l of nameLines){g.fillText(l,pad,y);y+=40}}
  return c;
}
async function renderMonthImage(monthKey){
  const [yy,mm]=monthKey.split("-").map(Number);
  const W=1080,pad=56,gap=10,cols=7,cw=(W-pad*2-gap*6)/cols,ch=cw*4/3;
  const first=new Date(yy,mm-1,1).getDay(),days=new Date(yy,mm,0).getDate(),rows=Math.ceil((first+days)/7);
  const top=200;
  const c=document.createElement("canvas");c.width=W;c.height=top+rows*(ch+gap)+110;const g=c.getContext("2d");
  g.fillStyle=SHARE_C.bg;g.fillRect(0,0,c.width,c.height);
  const monthItems=items.filter(i=>i.meta.d.slice(0,7)===monthKey&&!isText(i));
  await drawHeader(g,W,`${yy}년 ${mm}월`,`${monthItems.length}점`);
  await loadTextFonts();
  g.fillStyle=SHARE_C.muted;g.font=`400 20px ${F_MONO}`;g.textAlign="center";
  WD.forEach((w,i)=>g.fillText(w,pad+i*(cw+gap)+cw/2,top-22));g.textAlign="left";
  for(let n=1;n<=days;n++){
    const idx=first+n-1,col=idx%7,row=Math.floor(idx/7);
    const x=pad+col*(cw+gap),y=top+row*(ch+gap);
    const key=`${monthKey}-${String(n).padStart(2,"0")}`;
    const has=items.some(i=>i.meta.d===key),mc=miniCell(key),spec=miniBg(key,mc,has),nc=dayCells(key);
    g.save();rrect(g,x,y,cw,ch,14);g.fillStyle=has?SHARE_C.cellOn:SHARE_C.cell;g.fill();g.clip();
    if(spec)await drawBoardBg(g,spec,x,y,cw,ch);
    const bh=cw/BOARD_RATIO,by=y+(ch-bh)/2;   // 날짜 칸에는 선반의 가운데 부분이 보여요(화면과 같아요)
    if(has)for(const it of dayOrder(key,mc)){   // 화면의 작은 선반과 같은 계산
      if(isText(it)){drawTextItem(g,it,x,by,cw,bh);continue}
      let im;try{im=await imgFromUrl(await getImg(it.id))}catch(_){continue}
      const w=it.meta.s*cw,h=w*im.naturalHeight/im.naturalWidth;
      g.save();g.translate(x+it.meta.x*cw,by+it.meta.y*bh-w/2+h/2);g.rotate(it.meta.r*Math.PI/180);
      g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=6;g.shadowOffsetY=4;g.drawImage(im,-w/2,-h/2,w,h);g.restore();
    }
    g.restore();
    const pill=(t,px,py,right)=>{g.font=`500 ${right?17:20}px ${F_MONO}`;const tw=g.measureText(t).width,bx=right?px-tw-6:px-5;
      if(spec){g.fillStyle="rgba(20,18,24,.6)";rrect(g,bx,py-(right?16:19),tw+11,right?22:26,5);g.fill()}
      g.fillStyle=!right&&key===today()?SHARE_C.accent:(spec?"#d8d3e0":SHARE_C.muted);g.textAlign="left";g.fillText(t,right?px-tw:px,py)};
    pill(String(n),x+12,y+28);
    if(nc>1)pill(nc+"칸",x+cw-10,y+ch-10,true);
  }
  g.fillStyle=SHARE_C.muted;g.font=`500 24px ${F_BODY}`;g.fillText(monthItems.length?`이 달에 모은 물건 ${monthItems.length}점`:"이 달엔 아직 모은 물건이 없어요",pad,c.height-52);
  return c;
}
async function openShare(){

    if(!blob)return;
    if(canShareFile()){
      try{await navigator.share({files:[file()],title:"취향 진열장",text:isMonth?`${md(cur).split(" ")[0]} 진열장`:`${md(cur)}의 진열장`})}
      catch(e){if(e&&e.name!=="AbortError"){q("sErr").hidden=false;q("sErr").textContent="공유하지 못했어요. 이미지 저장을 눌러 직접 보내 주세요."}}
    }else{q("sErr").hidden=false;q("sErr").textContent="이 브라우저는 바로 공유를 지원하지 않아요. 이미지 저장 후 보내 주세요."}
  };
  q("sSave").onclick=()=>{
    if(!blob)return;const a=document.createElement("a");a.href=url;a.download=fnameOf();document.body.appendChild(a);a.click();a.remove();toast("이미지를 저장했어요");
  };
  q("sClose").onclick=()=>s.close();
  s.onpop=()=>{if(url)URL.revokeObjectURL(url)};
  make();
}
function updAtticBadge(){$("atticDot").hidden=!attic.length;$("menuBtn").setAttribute("aria-label",attic.length?`메뉴 (다락방에 ${attic.length}개)`:"메뉴")}

/* ================= 날짜 이동 ================= */
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("dLabel").onclick=()=>{if(view==="list")return;if(cur!==today()){cur=today();curCell=1;render();toast("오늘로 돌아왔어요")}};
document.addEventListener("keydown",e=>{if(document.querySelector(".scrim")||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||view==="list")return;
  if(e.key==="ArrowLeft")shift(-1);if(e.key==="ArrowRight")shift(1)});
function shift(k){if(view==="list")return;const d=parse(cur);if(view==="day")d.setDate(d.getDate()+k);else{d.setDate(1);d.setMonth(d.getMonth()+k)}cur=ymd(d);curCell=1;deselect();render()}
/* 자정이 지나면 '오늘' 표시를 갱신 */
setInterval(()=>{const t=today();if(t!==render.lastToday){const wasToday=cur===render.lastToday;render.lastToday=t;if(wasToday)cur=t;if(ready)render()}},60000);
render.lastToday=today();

/* ================= 시작 ================= */
$("ver2").textContent=APP_VERSION;initLoginScene();initIcons();
(function versionNote(){const last=store.get("appVersion");store.set("appVersion",APP_VERSION);
  if(last&&last!==APP_VERSION)setTimeout(()=>toast(`새 버전 ${APP_VERSION} · 메뉴에서 업데이트 내용 보기`,3500),800)})();
render();
initAuth();
(function resume(){
  let saved=null;try{saved=JSON.parse(store.get("tok")||"null")}catch(_){}
  if(saved&&saved.t&&saved.e>Date.now()){token=saved.t;tokenExp=saved.e;$("login").hidden=true;start()}
  else if(store.get("signedIn")){
    $("loginBtn").textContent="이어서 열기";
    $("loginText").textContent="진열장은 드라이브에 그대로 있어요. 보안을 위해 한 시간에 한 번 눌러 주세요.";
  }
})();
/* 버튼을 손가락으로 누르면 아주 짧게 진동해요(안드로이드). 선반 위 물건은 제외 */
document.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;const b=e.target.closest("button:not(:disabled),.tile,.mlist a");if(!b||b.closest(".login"))return;try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}},{passive:true});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
