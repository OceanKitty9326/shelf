  const c=document.createElement("canvas");const g=c.getContext("2d");
  g.font=`400 26px ${F_BODY}`;
  const nameLines=withNames&&names.length?wrapLines(g,names.join(" · "),BW,3):[];
  const top=170,footer=70+(nameLines.length?nameLines.length*40+16:0);
  c.width=W;c.height=top+BH+footer+40;
  g.fillStyle=SHARE_C.bg;g.fillRect(0,0,c.width,c.height);
  const d=parse(day);
  await drawHeader(g,W,`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`,`${WD[d.getDay()]}요일`);
  // 선반
  g.save();rrect(g,pad,top,BW,BH,28);g.clip();
  g.fillStyle=SHARE_C.board;g.fillRect(pad,top,BW,BH);
  const rg=g.createRadialGradient(pad+BW/2,top+BH*1.1,0,pad+BW/2,top+BH*1.1,BH*.75);rg.addColorStop(0,"#2b2633");rg.addColorStop(1,"rgba(43,38,51,0)");
  g.fillStyle=rg;g.fillRect(pad,top,BW,BH);
  await loadTextFonts();
  for(const it of list){
    if(isText(it)){drawTextItem(g,it,pad,top,BW,BH);continue}
    let im;try{im=await imgFromUrl(await getImg(it.id))}catch(_){continue}
    const w=it.meta.s*BW,h=w*im.naturalHeight/im.naturalWidth;
    // 화면과 똑같이: 왼쪽 위 = (x*W - w/2, y*H - w/2), 회전은 물건 가운데 기준
    const cx=pad+it.meta.x*BW,cy=top+it.meta.y*BH-w/2+h/2;
    g.save();g.translate(cx,cy);g.rotate(it.meta.r*Math.PI/180);
    g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=26;g.shadowOffsetY=18;
    g.drawImage(im,-w/2,-h/2,w,h);g.restore();
  }
  g.restore();
  g.strokeStyle=SHARE_C.line;g.lineWidth=2;rrect(g,pad,top,BW,BH,28);g.stroke();
  if(!list.length){g.fillStyle=SHARE_C.muted;g.font=`400 28px ${F_BODY}`;g.textAlign="center";g.fillText("이날의 선반은 비어 있어요",W/2,top+BH/2);g.textAlign="left"}
  // 아래쪽
  let y=top+BH+56;
  g.fillStyle=SHARE_C.muted;g.font=`500 24px ${F_BODY}`;g.fillText(`진열된 물건 ${list.filter(i=>!isText(i)).length}점`,pad,y);
  if(nameLines.length){y+=48;g.fillStyle=SHARE_C.fg;g.font=`400 26px ${F_BODY}`;for(const l of nameLines){g.fillText(l,pad,y);y+=40}}
  return c;
}
async function renderMonthImage(monthKey){
  const [yy,mm]=monthKey.split("-").map(Number);
  const W=1080,pad=56,gap=10,cols=7,cw=(W-pad*2-gap*6)/cols,ch=cw*4/3;
  const first=new Date(yy,mm-1,1).getDay(),days=new Date(yy,mm,0).getDate(),rows=Math.ceil((first+days)/7);
  const top=200;
  const c=document.createElement("canvas");c.width=W;c.height=top+rows*(ch+gap)+110;const g=c.getContext("2d");
  g.fillStyle=SHARE_C.bg;g.fillRect(0,0,c.width,c.height);
  const monthItems=items.filter(i=>i.meta.d.slice(0,7)===monthKey&&!isText(i));
  await drawHeader(g,W,`${yy}년 ${mm}월`,`${monthItems.length}점`);
  g.fillStyle=SHARE_C.muted;g.font=`400 20px ${F_MONO}`;g.textAlign="center";
  WD.forEach((w,i)=>g.fillText(w,pad+i*(cw+gap)+cw/2,top-22));g.textAlign="left";
  for(let n=1;n<=days;n++){
    const idx=first+n-1,col=idx%7,row=Math.floor(idx/7);
    const x=pad+col*(cw+gap),y=top+row*(ch+gap);
    const key=`${monthKey}-${String(n).padStart(2,"0")}`;
    const its=items.filter(i=>i.meta.d===key&&!isText(i)).sort((a,b)=>b.meta.z-a.meta.z);
    g.save();rrect(g,x,y,cw,ch,14);g.fillStyle=its.length?SHARE_C.cellOn:SHARE_C.cell;g.fill();g.clip();
    for(let k=Math.min(3,its.length)-1;k>=0;k--){
      let im;try{im=await imgFromUrl(await getImg(its[k].id))}catch(_){continue}
      const box=cw*.62,sc=Math.min(box/im.naturalWidth,box/im.naturalHeight);const w=im.naturalWidth*sc,h=im.naturalHeight*sc;
      g.save();g.translate(x+cw/2+(k-1)*cw*.18,y+ch*.56+(k%2?-1:1)*ch*.04);g.rotate((k-1)*8*Math.PI/180);
      g.shadowColor="rgba(0,0,0,.4)";g.shadowBlur=8;g.shadowOffsetY=5;g.drawImage(im,-w/2,-h/2,w,h);g.restore();
    }
    g.restore();
    g.fillStyle=key===today()?SHARE_C.accent:SHARE_C.muted;g.font=`500 20px ${F_MONO}`;g.fillText(String(n),x+12,y+28);
    if(its.length>3){g.fillStyle=SHARE_C.muted;g.font=`400 18px ${F_MONO}`;g.textAlign="right";g.fillText("+"+(its.length-3),x+cw-10,y+ch-10);g.textAlign="left"}
  }
  g.fillStyle=SHARE_C.muted;g.font=`500 24px ${F_BODY}`;g.fillText(monthItems.length?`이 달에 모은 물건 ${monthItems.length}점`:"이 달엔 아직 모은 물건이 없어요",pad,c.height-52);
  return c;
}
async function openShare(){
  if(!ready){toast("진열장을 불러온 뒤에 공유할 수 있어요");return}
  const isMonth=view==="month";
  const s=sheet(`<h2>${isMonth?"이 달 달력 공유하기":"이 선반 공유하기"}</h2>
    <div class="preview sharepv"><img id="sPv" alt="공유할 이미지 미리보기"><p class="progress" id="sWait">이미지를 만드는 중…</p></div>
    ${isMonth?"":`<label class="toggle" for="sNames"><input type="checkbox" id="sNames"><span>물건 이름도 함께 넣기</span></label>`}
    <p class="err" id="sErr" hidden></p>
    <div class="row"><button class="btn" id="sSave">이미지 저장</button><button class="btn pri" id="sShare">공유하기</button></div>
    <div class="row"><button class="btn" id="sClose">닫기</button></div>`);
  const q=id=>s.querySelector("#"+id);
  let blob=null,url=null,gen=0;
  const fname=`취향진열장-${isMonth?cur.slice(0,7):cur}.png`;
  async function make(){
    const my=++gen;q("sWait").hidden=false;q("sShare").disabled=q("sSave").disabled=true;
    try{
      try{await document.fonts.ready}catch(_){}
      const c=isMonth?await renderMonthImage(cur.slice(0,7)):await renderDayImage(cur,q("sNames")&&q("sNames").checked);
      const b=await new Promise(r=>c.toBlob(r,"image/png"));
      if(my!==gen||!s.isConnected)return;
      blob=b;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);q("sPv").src=url;
      q("sWait").hidden=true;q("sShare").disabled=q("sSave").disabled=false;
    }catch(e){q("sWait").hidden=true;q("sErr").hidden=false;q("sErr").textContent="이미지를 만들지 못했어요. 사진이 다 불러와진 뒤 다시 시도해 주세요."}
  }
  if(q("sNames"))q("sNames").onchange=()=>{store.set("shareNames",q("sNames").checked?"1":"0");make()};
  if(q("sNames")&&store.get("shareNames")==="1")q("sNames").checked=true;
  const file=()=>new File([blob],fname,{type:"image/png"});
  const canShareFile=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[file()]}))}catch(_){return false}};
  q("sShare").onclick=async()=>{
    if(!blob)return;
    if(canShareFile()){
      try{await navigator.share({files:[file()],title:"취향 진열장",text:isMonth?`${md(cur).split(" ")[0]} 진열장`:`${md(cur)}의 진열장`})}
      catch(e){if(e&&e.name!=="AbortError"){q("sErr").hidden=false;q("sErr").textContent="공유하지 못했어요. 이미지 저장을 눌러 직접 보내 주세요."}}
    }else{q("sErr").hidden=false;q("sErr").textContent="이 브라우저는 바로 공유를 지원하지 않아요. 이미지 저장 후 보내 주세요."}
  };
  q("sSave").onclick=()=>{
    if(!blob)return;const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("이미지를 저장했어요");
  };
  q("sClose").onclick=()=>s.close();
  s.onpop=()=>{if(url)URL.revokeObjectURL(url)};
  make();
}
$("shareBtn").onclick=openShare;

/* ================= 날짜 이동 ================= */
$("vDay").onclick=()=>{view="day";render()};
$("vMonth").onclick=()=>{view="month";render()};
$("vList").onclick=()=>{view="list";render();setTimeout(()=>{if(window.innerWidth>700)$("q").focus()},50)};
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("dLabel").onclick=()=>{if(view==="list")return;if(cur!==today()){cur=today();render();toast("오늘로 돌아왔어요")}};
document.addEventListener("keydown",e=>{if(document.querySelector(".scrim")||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||view==="list")return;
  if(e.key==="ArrowLeft")shift(-1);if(e.key==="ArrowRight")shift(1)});
function shift(k){if(view==="list")return;const d=parse(cur);if(view==="day")d.setDate(d.getDate()+k);else{d.setDate(1);d.setMonth(d.getMonth()+k)}cur=ymd(d);render()}
/* 자정이 지나면 '오늘' 표시를 갱신 */
setInterval(()=>{const t=today();if(t!==render.lastToday){const wasToday=cur===render.lastToday;render.lastToday=t;if(wasToday)cur=t;if(ready)render()}},60000);
render.lastToday=today();

/* ================= 시작 ================= */
$("ver").textContent=$("ver2").textContent=APP_VERSION;
(function versionNote(){const last=store.get("appVersion");store.set("appVersion",APP_VERSION);
  if(last&&last!==APP_VERSION)setTimeout(()=>toast(`새 버전 ${APP_VERSION}(으)로 업데이트됐어요`,3000),800)})();
render();
initAuth();
(function resume(){
  let saved=null;try{saved=JSON.parse(store.get("tok")||"null")}catch(_){}
  if(saved&&saved.t&&saved.e>Date.now()){token=saved.t;tokenExp=saved.e;$("login").hidden=true;start()}
  else if(store.get("signedIn")){
    $("loginBtn").textContent="이어서 열기";
    $("loginText").textContent="진열장은 드라이브에 그대로 있어요. 보안을 위해 한 시간에 한 번 눌러 주세요.";
  }
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
